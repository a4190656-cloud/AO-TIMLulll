<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO Banking | Premium Budget</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#06090F', card: '#0D1320', surface: '#131D2E' },
                        neon: { cyan: '#00E5FF', green: '#00E676', red: '#FF1744', gold: '#FFD600' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Syne', sans-serif; background: #06090F; color: #FFF; overflow-x: hidden; }
        .glass-card { background: rgba(13, 19, 32, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.5rem; }
        .hero-card { background: linear-gradient(135deg, #0D1320 0%, #080C16 100%); border: 1px solid rgba(0,229,255,0.2); border-radius: 2rem; position: relative; overflow: hidden; }
        .cyber-input { background: rgba(6,9,15,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 1rem; width: 100%; color: #FFF; text-align: right; outline: none; transition: 0.3s; }
        .cyber-input:focus { border-color: #00E5FF; box-shadow: 0 0 15px rgba(0,229,255,0.15); }
        .press:active { transform: scale(0.97); }
        @keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .rise { animation: floatUp 0.6s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyBqpLOIbztpurGuUqpfaWZT71JcofKG2rc",
            authDomain: "riki-aharele-budget.firebaseapp.com",
            projectId: "riki-aharele-budget",
            storageBucket: "riki-aharele-budget.firebasestorage.app",
            messagingSenderId: "53506652532",
            appId: "1:53506652532:web:28b3e3fc28114b1feb9421"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Icon Component Fix
        const Icon = ({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px;"></i>`;
                    window.lucide.createIcons({ root: ref.current });
                }
            }, [name, size]);
            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [data, setData] = useState({ incomes: [], expenses: [], balance: 0 });
            const [view, setView] = useState('dashboard'); // dashboard | settings
            const [modal, setModal] = useState(null); // 'income' | 'expense' | null

            // Auth Listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            // Firestore Data Listener
            useEffect(() => {
                if (!user) return;
                const userRef = db.collection('users').doc(user.uid);
                
                const unsubIncomes = userRef.collection('incomes').onSnapshot(snap => {
                    const inc = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setData(prev => ({ ...prev, incomes: inc }));
                });

                const unsubExpenses = userRef.collection('expenses').onSnapshot(snap => {
                    const exp = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setData(prev => ({ ...prev, expenses: exp }));
                });

                return () => { unsubIncomes(); unsubExpenses(); };
            }, [user]);

            // Simple Balance Calc
            const stats = useMemo(() => {
                const totalInc = data.incomes.reduce((s, i) => s + Number(i.amount || 0), 0);
                const totalExp = data.expenses.reduce((s, i) => s + Number(i.amount || 0), 0);
                return { totalInc, totalExp, balance: totalInc - totalExp };
            }, [data]);

            const handleGoogleLogin = () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(err => alert("שגיאה בהתחברות: " + err.message));
            };

            const addTransaction = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const amount = formData.get('amount');
                const desc = formData.get('desc');
                
                const col = modal === 'income' ? 'incomes' : 'expenses';
                await db.collection('users').doc(user.uid).collection(col).add({
                    amount: Number(amount),
                    description: desc,
                    date: new Date().toISOString()
                });
                setModal(null);
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="animate-pulse text-neon-cyan font-bold">טוען מערכת AO...</div>
                </div>
            );

            if (!user) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-dark-bg">
                    <div className="hero-card p-10 text-center rise w-full max-w-sm">
                        <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-24 h-24 rounded-2xl mx-auto mb-6 border-2 border-neon-cyan/30" />
                        <h1 className="text-3xl font-black mb-2">AO Banking</h1>
                        <p className="text-slate-400 text-sm mb-8">ניהול תקציב פרימיום</p>
                        <button onClick={handleGoogleLogin} className="press w-full bg-white text-dark-bg py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                            כניסה עם גוגל
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-32">
                    {/* Header */}
                    <header className="p-6 rise">
                        <div className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-3">
                                <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-12 h-12 rounded-xl border border-white/10" />
                                <div>
                                    <h2 className="font-bold text-lg leading-none">שלום, {user.displayName?.split(' ')[0]}</h2>
                                    <span className="text-[10px] text-neon-cyan font-mono uppercase tracking-widest">AO Account Active</span>
                                </div>
                            </div>
                            <button onClick={() => auth.signOut()} className="glass-card p-2 text-slate-400"><Icon name="log-out" size={18}/></button>
                        </div>

                        <div className="hero-card p-8 text-center shadow-2xl shadow-neon-cyan/5">
                            <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">יתרה זמינה</p>
                            <h1 className="text-5xl font-black text-neon-cyan" dir="ltr">₪{stats.balance.toLocaleString()}</h1>
                        </div>
                    </header>

                    {/* Actions */}
                    <main className="px-6 space-y-6 rise" style={{animationDelay: '0.2s'}}>
                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={() => setModal('income')} className="press glass-card p-4 border-b-4 border-b-neon-green flex flex-col items-center gap-2">
                                <Icon name="arrow-up-circle" className="text-neon-green" />
                                <span className="font-bold text-sm">הכנסה</span>
                            </button>
                            <button onClick={() => setModal('expense')} className="press glass-card p-4 border-b-4 border-b-neon-red flex flex-col items-center gap-2">
                                <Icon name="arrow-down-circle" className="text-neon-red" />
                                <span className="font-bold text-sm">הוצאה</span>
                            </button>
                        </div>

                        {/* Recent Transactions */}
                        <div className="space-y-3">
                            <h3 className="font-bold text-slate-400 text-sm">תנועות אחרונות</h3>
                            <div className="glass-card divide-y divide-white/5 overflow-hidden">
                                {[...data.incomes, ...data.expenses]
                                    .sort((a,b) => new Date(b.date) - new Date(a.date))
                                    .slice(0, 10).map(t => (
                                    <div key={t.id} className="p-4 flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${data.incomes.includes(t) ? 'bg-neon-green/10 text-neon-green' : 'bg-neon-red/10 text-neon-red'}`}>
                                                <Icon name={data.incomes.includes(t) ? "trending-up" : "trending-down"} size={14} />
                                            </div>
                                            <div>
                                                <p className="font-bold text-sm">{t.description}</p>
                                                <p className="text-[10px] text-slate-500 font-mono">{new Date(t.date).toLocaleDateString('he-IL')}</p>
                                            </div>
                                        </div>
                                        <span className={`font-mono font-bold ${data.incomes.includes(t) ? 'text-neon-green' : 'text-white'}`}>
                                            {data.incomes.includes(t) ? '+' : '-'}{t.amount}₪
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Modal */}
                    {modal && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setModal(null)} />
                            <form onSubmit={addTransaction} className="glass-card w-full max-w-md p-8 relative z-10 border-t-4 border-t-neon-cyan">
                                <h3 className="text-xl font-bold mb-6 text-center">{modal === 'income' ? 'הוספת הכנסה' : 'הוספת הוצאה'}</h3>
                                <div className="space-y-4">
                                    <input name="amount" type="number" required placeholder="סכום (₪)" className="cyber-input text-2xl font-black text-center" autoFocus />
                                    <input name="desc" type="text" required placeholder="תיאור הפעולה" className="cyber-input" />
                                    <button type="submit" className={`w-full py-4 rounded-xl font-bold text-dark-bg ${modal === 'income' ? 'bg-neon-green' : 'bg-neon-red text-white'}`}>
                                        אישור ועדכון
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Nav */}
                    <nav className="fixed bottom-6 left-6 right-6 glass-card p-3 flex justify-around items-center border border-white/10">
                        <button className="text-neon-cyan flex flex-col items-center gap-1">
                            <Icon name="layout-dashboard" />
                            <span className="text-[10px] font-bold">ראשי</span>
                        </button>
                        <div className="w-px h-6 bg-white/10" />
                        <button className="text-slate-500 flex flex-col items-center gap-1">
                            <Icon name="settings" />
                            <span className="text-[10px] font-bold">הגדרות</span>
                        </button>
                    </nav>
                </div>
            );
        };

        // Mount
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
