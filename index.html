<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" type="image/jpg" href="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg">

    <title>AO Banking | Premium Management</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#04060A', card: '#0F1521', surface: '#161D2D' },
                        bank: { balance: '#00E5FF', income: '#00E676', expense: '#FF1744', gold: '#D4AF37' }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #04060A; 
            color: #FFFFFF; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(0, 229, 255, 0.05), transparent);
        }

        .premium-card {
            background: rgba(15, 21, 33, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
        }

        /* Animated Scan Bar */
        .scan-bar { position: relative; overflow: hidden; }
        .scan-bar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            animation: scanning 3s infinite linear;
        }

        @keyframes scanning { 0% { left: -100%; } 100% { left: 100%; } }

        .hover-press:active { transform: scale(0.96); transition: 0.1s; }

        .cyber-input {
            background: rgba(6, 9, 15, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.25rem;
            padding: 1rem 1.5rem;
            width: 100%;
            outline: none;
            color: white;
            font-weight: 600;
        }

        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqpLOIbztpurGuUqpfaWZT71JcofKG2rc",
            authDomain: "riki-aharele-budget.firebaseapp.com",
            projectId: "riki-aharele-budget",
            storageBucket: "riki-aharele-budget.firebasestorage.app",
            messagingSenderId: "53506652532",
            appId: "1:53506652532:web:28b3e3fc28114b1feb9421"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, className]);
            return <span ref={spanRef} style={{width: size, height: size}} className="inline-flex items-center justify-center"></span>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [resetDay, setResetDay] = useState(1);
            const [incomes, setIncomes] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [fixedExpenses, setFixedExpenses] = useState([]);
            const [fixedIncomes, setFixedIncomes] = useState([]);
            const [view, setView] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('income');
            const [newName, setNewName] = useState('');

            useEffect(() => {
                return auth.onAuthStateChanged(u => { 
                    setUser(u); 
                    setLoading(false);
                    if(u) setNewName(u.displayName || '');
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const userRef = db.collection('users').doc(user.uid);
                const unsub = [
                    userRef.onSnapshot(doc => doc.exists && setResetDay(doc.data().resetDay || 1)),
                    userRef.collection('incomes').onSnapshot(s => setIncomes(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    userRef.collection('expenses').onSnapshot(s => setExpenses(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    userRef.collection('fixed_settings').onSnapshot(s => setFixedExpenses(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    userRef.collection('fixed_incomes').onSnapshot(s => setFixedIncomes(s.docs.map(d => ({id: d.id, ...d.data()})))),
                ];
                return () => unsub.forEach(fn => fn());
            }, [user]);

            const cycleData = useMemo(() => {
                const now = new Date();
                let startDate = new Date(now.getFullYear(), now.getMonth(), resetDay);
                if (now.getDate() < resetDay) startDate.setMonth(startDate.getMonth() - 1);
                
                const totalInc = incomes.filter(i => new Date(i.date) >= startDate).reduce((s, i) => s + Number(i.amount), 0) + fixedIncomes.reduce((s, i) => s + Number(i.amount), 0);
                const totalExp = expenses.filter(i => new Date(i.date) >= startDate).reduce((s, i) => s + Number(i.amount), 0) + fixedExpenses.reduce((s, i) => s + Number(i.amount), 0);
                
                const list = [...incomes, ...expenses]
                    .filter(i => new Date(i.date) >= startDate)
                    .sort((a,b) => new Date(b.date) - new Date(a.date));

                return { balance: totalInc - totalExp, totalInc, totalExp, list };
            }, [incomes, expenses, fixedExpenses, fixedIncomes, resetDay]);

            const handleAddItem = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = modalType === 'income' ? 'incomes' : 'expenses';
                await db.collection('users').doc(user.uid).collection(col).add({ 
                    amount: Number(formData.get('amount')), 
                    description: formData.get('description'), 
                    date: new Date().toISOString() 
                });
                setIsModalOpen(false);
            };

            const deleteItem = async (col, id) => await db.collection('users').doc(user.uid).collection(col).doc(id).delete();

            if (loading) return <div className="min-h-screen flex items-center justify-center text-bank-balance font-black animate-pulse">AO BANKING...</div>;
            if (!user) return <LoginScreen auth={auth} />;

            return (
                <div className="max-w-md mx-auto min-h-screen pb-32 px-5">
                    <header className="pt-12 pb-6 fade-up">
                        <div className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 rounded-2xl overflow-hidden border border-white/10 shadow-xl">
                                    <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full object-cover" />
                                </div>
                                <div>
                                    <h2 className="text-lg font-extrabold">שלום, {user.displayName || 'אורח'}</h2>
                                    <p className="text-bank-balance text-[11px] font-black tracking-tight">התקציב האישי שלכם!</p>
                                </div>
                            </div>
                            <button onClick={() => auth.signOut()} className="p-3 premium-card hover-press text-slate-500"><Icon name="log-out" size={18}/></button>
                        </div>

                        <div className="premium-card p-8 text-center relative overflow-hidden border-t-2 border-t-bank-balance/30">
                            <p className="text-slate-500 text-[10px] font-black uppercase tracking-[0.2em] mb-1">יתרה נוכחית לשימוש</p>
                            <h1 className={`text-5xl font-black tracking-tighter ${cycleData.balance >= 0 ? 'text-white' : 'text-bank-expense'}`}>
                                ₪{cycleData.balance.toLocaleString()}
                            </h1>
                            <div className="mt-6 grid grid-cols-2 gap-4 pt-6 border-t border-white/5">
                                <div><p className="text-[9px] text-slate-500 font-bold mb-1">הכנסות</p><p className="text-bank-income font-black">₪{cycleData.totalInc.toLocaleString()}</p></div>
                                <div><p className="text-[9px] text-slate-500 font-bold mb-1">הוצאות</p><p className="text-bank-expense font-black">₪{cycleData.totalExp.toLocaleString()}</p></div>
                            </div>
                        </div>
                    </header>

                    <main className="space-y-6 fade-up">
                        {view === 'dashboard' ? (
                            <>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => { setModalType('income'); setIsModalOpen(true); }} className="premium-card p-6 flex flex-col items-center gap-2 scan-bar hover-press text-bank-income">
                                        <Icon name="plus-circle" /><span className="font-bold text-xs text-white">הכנסה חדשה</span>
                                    </button>
                                    <button onClick={() => { setModalType('expense'); setIsModalOpen(true); }} className="premium-card p-6 flex flex-col items-center gap-2 scan-bar hover-press text-bank-expense">
                                        <Icon name="minus-circle" /><span className="font-bold text-xs text-white">הוצאה חדשה</span>
                                    </button>
                                </div>

                                <div className="premium-card overflow-hidden">
                                    <div className="p-5 border-b border-white/5 flex justify-between items-center bg-white/[0.02]">
                                        <span className="text-[10px] font-black text-slate-500 tracking-widest">תנועות אחרונות במחזור</span>
                                    </div>
                                    <div className="divide-y divide-white/[0.03]">
                                        {cycleData.list.map(item => {
                                            const isInc = incomes.some(i => i.id === item.id);
                                            return (
                                                <div key={item.id} className="p-4 flex justify-between items-center group">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`p-2.5 rounded-lg ${isInc ? 'bg-bank-income/10 text-bank-income' : 'bg-white/5 text-slate-400'}`}><Icon name={isInc ? "arrow-up-right" : "arrow-down-left"} size={16}/></div>
                                                        <div><p className="text-sm font-bold">{item.description}</p><p className="text-[10px] text-slate-500">{new Date(item.date).toLocaleDateString('he-IL')}</p></div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <span className={`font-black ${isInc ? 'text-bank-income' : 'text-white'}`}>₪{item.amount.toLocaleString()}</span>
                                                        <button onClick={() => deleteItem(isInc ? 'incomes' : 'expenses', item.id)} className="text-slate-800 hover:text-bank-expense"><Icon name="x" size={14}/></button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="space-y-6 pb-10">
                                {/* Profile Name */}
                                <div className="premium-card p-6">
                                    <h3 className="font-black text-sm mb-4">ניהול פרופיל</h3>
                                    <div className="flex gap-2">
                                        <input value={newName} onChange={e => setNewName(e.target.value)} className="cyber-input text-sm" placeholder="שם המשתמש שלך" />
                                        <button onClick={async () => { await user.updateProfile({displayName: newName}); await db.collection('users').doc(user.uid).set({displayName: newName}, {merge:true}); alert('עודכן!'); }} className="bg-bank-balance text-dark-bg px-4 rounded-xl font-bold text-xs hover-press">עדכן</button>
                                    </div>
                                </div>

                                {/* Fixed Incomes */}
                                <div className="premium-card p-6">
                                    <h3 className="font-black text-sm mb-4 text-bank-income">הכנסות קבועות (משכורות/מלגות)</h3>
                                    <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        const f = new FormData(e.target);
                                        await db.collection('users').doc(user.uid).collection('fixed_incomes').add({ name: f.get('n'), amount: Number(f.get('a')) });
                                        e.target.reset();
                                    }} className="space-y-3 mb-6">
                                        <input name="n" placeholder="תיאור (למשל: משכורת)" required className="cyber-input text-sm" />
                                        <input name="a" type="number" placeholder="סכום קבוע" required className="cyber-input text-sm" />
                                        <button className="w-full bg-bank-income/20 text-bank-income border border-bank-income/30 p-3 rounded-xl font-bold text-xs hover-press">הוסף הכנסה קבועה</button>
                                    </form>
                                    <div className="space-y-2">
                                        {fixedIncomes.map(f => (
                                            <div key={f.id} className="flex justify-between items-center bg-white/5 p-3 rounded-xl">
                                                <span className="text-xs font-bold">{f.name}</span>
                                                <div className="flex items-center gap-3"><span className="text-bank-income font-black text-sm">₪{f.amount}</span><button onClick={() => deleteItem('fixed_incomes', f.id)} className="text-slate-600"><Icon name="trash" size={14}/></button></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Fixed Expenses */}
                                <div className="premium-card p-6">
                                    <h3 className="font-black text-sm mb-4 text-bank-expense">הוצאות קבועות (הוראות קבע)</h3>
                                    <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        const f = new FormData(e.target);
                                        await db.collection('users').doc(user.uid).collection('fixed_settings').add({ name: f.get('n'), amount: Number(f.get('a')) });
                                        e.target.reset();
                                    }} className="space-y-3 mb-6">
                                        <input name="n" placeholder="תיאור (למשל: שכירות)" required className="cyber-input text-sm" />
                                        <input name="a" type="number" placeholder="סכום קבוע" required className="cyber-input text-sm" />
                                        <button className="w-full bg-bank-expense/20 text-bank-expense border border-bank-expense/30 p-3 rounded-xl font-bold text-xs hover-press">הוסף הוצאה קבועה</button>
                                    </form>
                                    <div className="space-y-2">
                                        {fixedExpenses.map(f => (
                                            <div key={f.id} className="flex justify-between items-center bg-white/5 p-3 rounded-xl">
                                                <span className="text-xs font-bold">{f.name}</span>
                                                <div className="flex items-center gap-3"><span className="text-bank-expense font-black text-sm">₪{f.amount}</span><button onClick={() => deleteItem('fixed_settings', f.id)} className="text-slate-600"><Icon name="trash" size={14}/></button></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Reset Day */}
                                <div className="premium-card p-6 flex justify-between items-center">
                                    <div><p className="text-sm font-bold">יום איפוס חודשי</p><p className="text-[10px] text-slate-500">מתי התקציב מתחיל מחדש?</p></div>
                                    <input type="number" min="1" max="31" value={resetDay} onChange={e => db.collection('users').doc(user.uid).set({resetDay: Number(e.target.value)}, {merge:true})} className="cyber-input w-20 text-center text-xl font-black text-bank-balance" />
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Navigation Bar */}
                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-sm premium-card p-2 flex justify-between items-center z-50 border-white/10 shadow-2xl">
                        <button onClick={() => setView('dashboard')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl transition-all ${view === 'dashboard' ? 'bg-bank-balance/10 text-bank-balance' : 'text-slate-500'}`}>
                            <Icon name="home" size={20} />
                            <span className="text-[12px] font-extrabold mt-1">ראשי</span>
                        </button>
                        <button onClick={() => setView('settings')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl transition-all ${view === 'settings' ? 'bg-bank-balance/10 text-white' : 'text-slate-500'}`}>
                            <Icon name="settings" size={20} />
                            <span className="text-[12px] font-extrabold mt-1">הגדרות</span>
                        </button>
                    </nav>

                    {/* Quick Add Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end justify-center">
                            <div className="absolute inset-0 bg-dark-bg/95 backdrop-blur-md" onClick={() => setIsModalOpen(false)}></div>
                            <div className={`relative w-full max-w-md premium-card rounded-b-none rounded-t-[3rem] p-10 fade-up border-t-2 ${modalType === 'income' ? 'border-bank-income' : 'border-bank-expense'}`}>
                                <h3 className="text-xl font-black text-center mb-8">{modalType === 'income' ? 'הכנסה חדשה 💰' : 'הוצאה חדשה 💸'}</h3>
                                <form onSubmit={handleAddItem} className="space-y-6">
                                    <input name="amount" type="number" step="any" required autoFocus className="cyber-input text-5xl font-black text-center py-8" placeholder="0.00" />
                                    <input name="description" required className="cyber-input text-center text-lg" placeholder="מה התיאור?" />
                                    <button className={`w-full p-6 rounded-2xl font-black text-xl hover-press ${modalType === 'income' ? 'bg-bank-income text-dark-bg' : 'bg-white text-dark-bg'}`}>עדכן יתרה</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LoginScreen = ({ auth }) => (
            <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center fade-up">
                <div className="w-28 h-28 rounded-3xl overflow-hidden mb-6 border-2 border-bank-balance shadow-2xl">
                    <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full object-cover" />
                </div>
                <h1 className="text-3xl font-black mb-1">AO Banking</h1>
                <p className="text-slate-500 text-sm mb-12">התקציב האישי שלכם!</p>
                <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} className="premium-card px-10 py-5 flex items-center gap-4 bg-white text-dark-bg font-black hover-press">
                    התחברות עם Google
                </button>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
