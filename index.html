<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO ניהול תקציב</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#0A0E17', card: '#131927', surface: '#1A2235' },
                        neon: { cyan: '#00E5FF', green: '#00E676', red: '#FF1744' }
                    },
                    boxShadow: {
                        'glow-cyan': '0 0 20px -5px rgba(0, 229, 255, 0.4)',
                        'glow-green': '0 0 20px -5px rgba(0, 230, 118, 0.4)',
                        'glow-red': '0 0 20px -5px rgba(255, 23, 68, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #0A0E17;
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* עיצוב כרטיסים נקי ויוקרתי */
        .charcoal-card {
            background: rgba(19, 25, 39, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* מסגרת לוגו מודרנית (במקום העיגול המוזר) */
        .premium-logo-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            padding: 4px;
        }
        .premium-logo-box img {
            border-radius: 1.25rem;
        }

        .border-glow-cyan { border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 20px rgba(0, 229, 255, 0.1); }
        .text-glow-cyan { text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); color: #00E5FF; }

        .hover-bounce:active { transform: scale(0.96); }

        .cyber-input {
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.2rem;
            padding: 1.25rem;
            width: 100%;
            outline: none;
            color: #FFFFFF;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .cyber-input:focus { border-color: #00E5FF; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); background: rgba(19, 25, 39, 1); }

        @keyframes fadeInRise {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .animate-rise { animation: fadeInRise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqpLOIbztpurGuUqpfaWZT71JcofKG2rc",
            authDomain: "riki-aharele-budget.firebaseapp.com",
            projectId: "riki-aharele-budget",
            storageBucket: "riki-aharele-budget.firebasestorage.app",
            messagingSenderId: "53506652532",
            appId: "1:53506652532:web:28b3e3fc28114b1feb9421"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                    const svg = spanRef.current.querySelector('svg');
                    if (svg) { svg.style.width = size + 'px'; svg.style.height = size + 'px'; }
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center"></span>;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError() { return { hasError: true }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-dark-bg">
                            <h1 className="text-2xl font-bold text-white mb-4">מאתחל מערכת...</h1>
                            <button onClick={() => window.location.reload()} className="bg-neon-cyan text-black px-6 py-2 rounded-full font-bold">טען מחדש</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // רקע נקי ומקצועי למסך הכניסה
        const AmbientBackground = () => (
            <div className="fixed inset-0 w-full h-full z-[-1] overflow-hidden bg-dark-bg">
                <div className="absolute top-[-20%] left-[-20%] w-[500px] h-[500px] bg-blue-900 rounded-full mix-blend-screen filter blur-[120px] opacity-20 pointer-events-none"></div>
                <div className="absolute bottom-[-20%] right-[-20%] w-[500px] h-[500px] bg-cyan-900 rounded-full mix-blend-screen filter blur-[120px] opacity-20 pointer-events-none"></div>
            </div>
        );

        const LoginScreen = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
                    else await auth.signInWithEmailAndPassword(email, password);
                } catch (err) { setError('שגיאה בחיבור. בדוק את הפרטים.'); }
            };

            const handleGoogleLogin = async () => {
                try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } 
                catch (err) { console.error(err); }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center relative z-10 overflow-hidden">
                    <AmbientBackground />
                    
                    <div className="w-full max-w-sm z-10 animate-rise">
                        <div className="flex flex-col items-center mb-8">
                            <div className="w-28 h-28 premium-logo-box mb-6">
                                <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full object-cover" />
                            </div>
                            <h1 className="text-3xl font-black text-white mb-1">AO ניהול תקציב</h1>
                            <p className="text-slate-400 text-sm font-medium">התקציב האישי שלכם</p>
                        </div>

                        <div className="charcoal-card p-8 shadow-2xl relative">
                            <button onClick={handleGoogleLogin} className="hover-bounce w-full bg-white text-dark-bg p-4 rounded-2xl font-black flex items-center justify-center gap-3 shadow-lg mb-6 transition-all">
                                <Icon name="chrome" className="text-blue-500" /> התחברות עם גוגל
                            </button>

                            <div className="flex items-center gap-4 text-slate-500 mb-6">
                                <div className="h-px bg-slate-700 flex-1"></div>
                                <span className="text-[11px] font-bold uppercase tracking-wider">או במייל</span>
                                <div className="h-px bg-slate-700 flex-1"></div>
                            </div>
                            
                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                <input type="email" placeholder="אימייל" className="cyber-input text-right" value={email} onChange={e => setEmail(e.target.value)} required />
                                <input type="password" placeholder="סיסמא" className="cyber-input text-right" value={password} onChange={e => setPassword(e.target.value)} required />
                                {error && <p className="text-neon-red text-xs font-bold text-center">{error}</p>}
                                <button type="submit" className="hover-bounce w-full bg-neon-cyan text-dark-bg p-4 rounded-2xl font-black shadow-glow-cyan transition-all mt-2">
                                    {isRegister ? 'צור חשבון חדש' : 'כניסה למערכת'}
                                </button>
                            </form>
                            <button onClick={() => setIsRegister(!isRegister)} className="text-slate-400 text-sm font-bold mt-6 hover:text-white transition-colors">
                                {isRegister ? 'כבר יש חשבון? התחבר' : 'הרשמה מהירה לחשבון חדש'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [resetDay, setResetDay] = useState(1);
            
            const [incomes, setIncomes] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [fixedExpenses, setFixedExpenses] = useState([]);
            const [fixedIncomes, setFixedIncomes] = useState([]);
            const [view, setView] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('income');

            useEffect(() => {
                return auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                let unsubSettings = () => {}; let unsub1 = () => {}; let unsub2 = () => {}; let unsub3 = () => {}; let unsub4 = () => {};
                try {
                    const userRef = db.collection('users').doc(user.uid);
                    unsubSettings = userRef.onSnapshot(doc => { if (doc.exists && doc.data().resetDay) setResetDay(doc.data().resetDay); });
                    unsub1 = userRef.collection('incomes').onSnapshot(s => setIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub2 = userRef.collection('expenses').onSnapshot(s => setExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub3 = userRef.collection('fixed_settings').onSnapshot(s => setFixedExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub4 = userRef.collection('fixed_incomes').onSnapshot(s => setFixedIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                } catch (e) { console.error(e); }
                return () => { unsubSettings(); unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const cycleData = useMemo(() => {
                try {
                    const now = new Date();
                    let startDate = new Date(now.getFullYear(), now.getMonth(), resetDay || 1);
                    if (now.getDate() < (resetDay || 1)) startDate.setMonth(startDate.getMonth() - 1);
                    
                    const curVarInc = incomes.filter(i => new Date(i.date) >= startDate);
                    const curVarExp = expenses.filter(i => new Date(i.date) >= startDate);
                    const totalInc = curVarInc.reduce((s, i) => s + Number(i.amount || 0), 0) + fixedIncomes.reduce((s, i) => s + Number(i.amount || 0), 0);
                    const totalFixedExp = fixedExpenses.reduce((s, i) => s + Number(i.amount || 0), 0);
                    const totalVarExp = curVarExp.reduce((s, i) => s + Number(i.amount || 0), 0);
                    
                    return { totalIncome: totalInc, totalFixedExp, totalVarExp, balance: totalInc - totalFixedExp - totalVarExp, filteredIncomes: curVarInc, filteredExpenses: curVarExp };
                } catch (e) { return { totalIncome: 0, totalFixedExp: 0, totalVarExp: 0, balance: 0, filteredIncomes: [], filteredExpenses: [] }; }
            }, [incomes, expenses, fixedExpenses, fixedIncomes, resetDay]);

            const handleAddItem = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = modalType === 'income' ? 'incomes' : 'expenses';
                await db.collection('users').doc(user.uid).collection(col).add({ amount: Number(formData.get('amount')), description: formData.get('description'), date: new Date().toISOString() });
                setIsModalOpen(false);
            };

            const handleAddFixed = async (e, type) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = type === 'income' ? 'fixed_incomes' : 'fixed_settings';
                await db.collection('users').doc(user.uid).collection(col).add({ name: formData.get('name'), amount: Number(formData.get('amount')) });
                e.target.reset();
            };

            const deleteItem = async (col, id) => await db.collection('users').doc(user.uid).collection(col).doc(id).delete();

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-dark-bg relative">
                    <AmbientBackground />
                    <Icon name="loader-2" className="animate-spin text-neon-cyan" size={40} />
                </div>
            );
            
            if (!user) return <LoginScreen />;

            // חילוץ שם חכם - אם אין שם תצוגה מגוגל, ניקח את תחילת המייל
            const userName = user.displayName ? user.displayName.split(' ')[0] : (user.email ? user.email.split('@')[0] : 'משתמש');

            return (
                <div className="min-h-screen pb-32 bg-dark-bg relative">
                    <AmbientBackground />
                    <header className="px-6 pt-10 pb-4 relative z-10 animate-rise">
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 premium-logo-box">
                                    <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full object-cover" />
                                </div>
                                <div className="flex flex-col justify-center">
                                    <h1 className="text-xl font-bold text-white">שלום, {userName}</h1>
                                    <h2 className="text-sm text-slate-400 font-medium">התקציב האישי שלכם</h2>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => auth.signOut()} className="p-3 charcoal-card rounded-full hover-bounce text-slate-300">
                                    <Icon name="log-out" size={18}/>
                                </button>
                                <button onClick={() => window.location.reload()} className="p-3 charcoal-card rounded-full hover-bounce text-slate-300">
                                    <Icon name="refresh-cw" size={18}/>
                                </button>
                            </div>
                        </div>

                        <div className="charcoal-card border-glow-cyan p-8 text-center relative mt-4">
                            <div className="flex justify-center items-center gap-2 mb-2">
                                <Icon name="wallet" className="text-neon-cyan" size={20} />
                                <span className="text-white font-medium text-sm">יתרה פנויה לניצול</span>
                            </div>
                            <h2 className="text-5xl font-black text-glow-cyan tracking-tighter mt-2">
                                {cycleData.balance.toLocaleString()} ₪
                            </h2>
                        </div>

                        <div className="grid grid-cols-3 gap-3 mt-4">
                            <div className="charcoal-card p-4 text-center">
                                <p className="text-[11px] text-slate-400 font-bold mb-1">הכנסות</p>
                                <p className="text-white font-black text-lg">{cycleData.totalIncome.toLocaleString()} ₪</p>
                            </div>
                            <div className="charcoal-card p-4 text-center">
                                <p className="text-[11px] text-slate-400 font-bold mb-1">קבועות</p>
                                <p className="text-white font-black text-lg">-{cycleData.totalFixedExp.toLocaleString()} ₪</p>
                            </div>
                            <div className="charcoal-card p-4 text-center">
                                <p className="text-[11px] text-slate-400 font-bold mb-1">משתנות</p>
                                <p className="text-white font-black text-lg">-{cycleData.totalVarExp.toLocaleString()} ₪</p>
                            </div>
                        </div>
                    </header>

                    <main className="px-6 space-y-8 mt-2 relative z-10 animate-rise" style={{animationDelay: '0.1s'}}>
                        {view === 'dashboard' && (
                            <>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => { setModalType('income'); setIsModalOpen(true); }} className="hover-bounce charcoal-card border border-neon-cyan/20 p-5 flex flex-col items-center justify-center gap-3">
                                        <div className="bg-dark-bg p-3 rounded-full"><Icon name="arrow-up" className="text-neon-cyan" size={24} /></div>
                                        <span className="text-white font-bold">הכנסה</span>
                                    </button>
                                    <button onClick={() => { setModalType('expense'); setIsModalOpen(true); }} className="hover-bounce charcoal-card border border-slate-700/50 p-5 flex flex-col items-center justify-center gap-3">
                                        <div className="bg-dark-bg p-3 rounded-full"><Icon name="arrow-down" className="text-slate-300" size={24} /></div>
                                        <span className="text-white font-bold">הוצאה</span>
                                    </button>
                                </div>

                                <section>
                                    <h3 className="font-bold text-lg text-white mb-4">תנועות אחרונות</h3>
                                    <div className="space-y-3">
                                        {(() => {
                                            const combined = [...cycleData.filteredIncomes, ...cycleData.filteredExpenses].sort((a,b) => new Date(b.date) - new Date(a.date));
                                            if (combined.length === 0) return <div className="charcoal-card p-6 text-center text-slate-500 font-medium">אין תנועות במחזור זה.</div>;
                                            return combined.map(item => {
                                                const isInc = incomes.some(i => i.id === item.id);
                                                return (
                                                    <div key={item.id} className="charcoal-card p-4 flex justify-between items-center border border-white/5">
                                                        <div className="flex items-center gap-4">
                                                            <div className={`p-2 rounded-full bg-dark-bg border ${isInc ? 'border-neon-cyan/30 text-neon-cyan' : 'border-slate-700 text-slate-300'}`}>
                                                                <Icon name={isInc ? "plus" : "minus"} size={16} />
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-white text-sm">{item.description}</p>
                                                                <p className="text-[10px] text-slate-400 mt-0.5">{new Date(item.date).toLocaleDateString('he-IL')}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className={`font-bold ${isInc ? 'text-neon-cyan' : 'text-white'}`}>{item.amount} ₪</span>
                                                            <button onClick={() => deleteItem(isInc ? 'incomes' : 'expenses', item.id)} className="text-slate-600 hover:text-neon-red transition-colors p-2"><Icon name="trash-2" size={16} /></button>
                                                        </div>
                                                    </div>
                                                );
                                            });
                                        })()}
                                    </div>
                                </section>
                            </>
                        )}

                        {view === 'settings' && (
                            <section className="space-y-8 animate-rise">
                                <div className="charcoal-card p-6">
                                    <h3 className="font-bold text-lg text-white mb-2 flex items-center gap-2"><Icon name="calendar" className="text-neon-cyan"/> יום איפוס חודשי</h3>
                                    <p className="text-slate-400 text-sm mb-4">באיזה יום בחודש התקציב יתאפס?</p>
                                    <div className="flex items-center gap-4">
                                        <input type="number" min="1" max="31" value={resetDay} onChange={(e) => {
                                            const v = Number(e.target.value);
                                            setResetDay(v);
                                            if(v >= 1 && v <= 31) db.collection('users').doc(user.uid).set({ resetDay: v }, { merge: true });
                                        }} className="cyber-input text-center text-xl w-24" />
                                        <span className="font-bold text-slate-300">לחודש</span>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-lg text-white mb-3">הכנסות קבועות</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'income')} className="charcoal-card p-5 space-y-4">
                                        <input name="name" required className="cyber-input" placeholder="שם (למשל: משכורת)" />
                                        <input name="amount" type="number" required className="cyber-input" placeholder="סכום (₪)" />
                                        <button type="submit" className="w-full bg-dark-surface border border-slate-700 text-white p-3 rounded-xl font-bold hover-bounce">שמור הכנסה</button>
                                    </form>
                                    <div className="mt-3 space-y-2">{fixedIncomes.map(item => (
                                        <div key={item.id} className="charcoal-card p-3 flex justify-between items-center"><p className="text-sm font-medium">{item.name}</p><div className="flex gap-4"><span className="text-neon-cyan font-bold text-sm">₪{item.amount}</span><button onClick={() => deleteItem('fixed_incomes', item.id)} className="text-slate-500"><Icon name="x" size={16}/></button></div></div>
                                    ))}</div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-lg text-white mb-3">הוצאות קבועות</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'expense')} className="charcoal-card p-5 space-y-4">
                                        <input name="name" required className="cyber-input" placeholder="שם (למשל: שכירות)" />
                                        <input name="amount" type="number" required className="cyber-input" placeholder="סכום (₪)" />
                                        <button type="submit" className="w-full bg-dark-surface border border-slate-700 text-white p-3 rounded-xl font-bold hover-bounce">שמור הוצאה</button>
                                    </form>
                                    <div className="mt-3 space-y-2">{fixedExpenses.map(item => (
                                        <div key={item.id} className="charcoal-card p-3 flex justify-between items-center"><p className="text-sm font-medium">{item.name}</p><div className="flex gap-4"><span className="font-bold text-sm">₪{item.amount}</span><button onClick={() => deleteItem('fixed_settings', item.id)} className="text-slate-500"><Icon name="x" size={16}/></button></div></div>
                                    ))}</div>
                                </div>
                            </section>
                        )}
                    </main>

                    <nav className="fixed bottom-4 left-6 right-6 charcoal-card p-3 flex justify-around rounded-[2rem] z-40 border border-white/10">
                        <button onClick={() => setView('dashboard')} className={`hover-bounce flex flex-col items-center px-10 py-2 rounded-xl transition-all ${view === 'dashboard' ? 'text-neon-cyan' : 'text-slate-500'}`}><Icon name="layout-dashboard" size={24} /><span className="text-[11px] font-bold mt-1">ראשי</span></button>
                        <button onClick={() => setView('settings')} className={`hover-bounce flex flex-col items-center px-10 py-2 rounded-xl transition-all ${view === 'settings' ? 'text-white' : 'text-slate-500'}`}><Icon name="settings" size={24} /><span className="text-[11px] font-bold mt-1">הגדרות</span></button>
                    </nav>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setIsModalOpen(false)}></div>
                            <div className="relative w-full max-w-md charcoal-card rounded-b-none rounded-t-[2.5rem] p-8 animate-rise border-t-2 border-slate-700">
                                <div className="w-12 h-1 bg-slate-600 rounded-full mx-auto mb-6"></div>
                                <h3 className="text-2xl font-bold text-center mb-6 text-white">{modalType === 'income' ? 'הכנסה חדשה' : 'הוצאה חדשה'}</h3>
                                <form onSubmit={handleAddItem} className="space-y-6">
                                    <div className="relative">
                                        <span className={`absolute left-6 top-1/2 -translate-y-1/2 text-2xl font-bold ${modalType === 'income' ? 'text-neon-cyan' : 'text-white'}`}>₪</span>
                                        <input name="amount" type="number" required autoFocus className={`cyber-input text-5xl font-black text-center py-6 transition-all ${modalType === 'income' ? 'text-neon-cyan focus:border-neon-cyan' : 'text-white focus:border-white'}`} placeholder="0" />
                                    </div>
                                    <input name="description" required className="cyber-input text-center" placeholder="על מה מדובר?" />
                                    <button type="submit" className={`hover-bounce w-full p-5 rounded-[1.5rem] font-bold text-xl text-dark-bg ${modalType === 'income' ? 'bg-neon-cyan shadow-glow-cyan' : 'bg-white'}`}>שמור תנועה</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
