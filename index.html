<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO ניהול תקציב</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        light: {
                            bg: '#F8FAFC',
                            card: '#FFFFFF',
                            text: '#0F172A',
                            muted: '#64748B'
                        },
                        brand: {
                            turquoise: '#0D9488', // Deep turquoise for primary numbers
                            gold: '#D4AF37',      // Brushed gold
                            red: '#E11D48'        // Soft elegant red
                        }
                    },
                    boxShadow: {
                        'spatial': '0 20px 40px -15px rgba(0, 0, 0, 0.05)',
                        'spatial-hover': '0 30px 60px -20px rgba(0, 0, 0, 0.1)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.3)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 100%);
            color: #0F172A;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* רקע נושם ונקי */
        .ambient-light {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.8), transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* מודולים מרחפים (Spatial Modules) */
        .spatial-module {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hover-float { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-float:active { transform: scale(0.97) translateY(2px); box-shadow: 0 10px 20px -10px rgba(15, 23, 42, 0.05); }

        /* כניסה חלקה */
        @keyframes fadeInRise {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-rise { animation: fadeInRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        /* שדות הזנה נקיים */
        .clean-input {
            background: rgba(248, 250, 252, 0.8);
            border: 1px solid #E2E8F0;
            border-radius: 1.5rem;
            padding: 1.25rem;
            width: 100%;
            outline: none;
            color: #0F172A;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .clean-input:focus { 
            border-color: #0D9488; 
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1), inset 0 2px 4px rgba(0,0,0,0.02); 
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqpLOIbztpurGuUqpfaWZT71JcofKG2rc",
            authDomain: "riki-aharele-budget.firebaseapp.com",
            projectId: "riki-aharele-budget",
            storageBucket: "riki-aharele-budget.firebasestorage.app",
            messagingSenderId: "53506652532",
            appId: "1:53506652532:web:28b3e3fc28114b1feb9421"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const LoginScreen = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');

            const handleGoogleLogin = async () => {
                try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } 
                catch (err) { setError("אופס, הייתה בעיה בהתחברות לגוגל. נסה שוב."); }
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
                    else await auth.signInWithEmailAndPassword(email, password);
                } catch (err) { setError('המייל או הסיסמה לא נכונים.'); }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center relative z-10">
                    <div className="ambient-light"></div>
                    <div className="animate-rise w-full max-w-sm">
                        <div className="mx-auto w-32 h-32 rounded-[2.5rem] p-1 bg-white shadow-spatial mb-8 hover-float relative">
                            <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="rounded-[2.2rem] w-full h-full object-cover" />
                        </div>
                        <h1 className="text-4xl font-bold text-light-text mb-2">AO ניהול תקציב</h1>
                        <p className="text-light-muted font-medium mb-10">הדרך הפשוטה לנהל את הכסף</p>

                        <div className="space-y-6 spatial-module p-8 rounded-[2.5rem]">
                            <button onClick={handleGoogleLogin} className="hover-float w-full bg-white border border-slate-200 text-light-text p-4 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-sm">
                                <span className="text-xl">🚀</span> כניסה מהירה עם גוגל
                            </button>
                            
                            <div className="flex items-center gap-4 text-slate-400">
                                <div className="h-px bg-slate-200 flex-1"></div>
                                <span className="text-xs">או עם מייל וסיסמה</span>
                                <div className="h-px bg-slate-200 flex-1"></div>
                            </div>
                            
                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                <input type="email" placeholder="אימייל" className="clean-input" value={email} onChange={e => setEmail(e.target.value)} required />
                                <input type="password" placeholder="סיסמה" className="clean-input" value={password} onChange={e => setPassword(e.target.value)} required />
                                {error && <p className="text-brand-red text-sm font-medium">{error}</p>}
                                <button type="submit" className="hover-float w-full bg-brand-turquoise text-white p-4 rounded-2xl font-bold shadow-md shadow-teal-500/20">
                                    {isRegister ? 'צור חשבון חדש' : 'היכנס למערכת'}
                                </button>
                            </form>
                            <button onClick={() => setIsRegister(!isRegister)} className="text-brand-gold text-sm font-medium underline mt-4">
                                {isRegister ? 'כבר יש לך חשבון? התחבר' : 'לחץ כאן כדי להירשם'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [resetDay, setResetDay] = useState(1);
            const [localResetDay, setLocalResetDay] = useState(1);
            
            const [incomes, setIncomes] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [fixedExpenses, setFixedExpenses] = useState([]);
            const [fixedIncomes, setFixedIncomes] = useState([]);
            const [view, setView] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('income');

            useEffect(() => {
                return auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                let unsubSettings = () => {};
                let unsub1 = () => {};
                let unsub2 = () => {};
                let unsub3 = () => {};
                let unsub4 = () => {};

                try {
                    const userRef = db.collection('users').doc(user.uid);
                    unsubSettings = userRef.onSnapshot(doc => { 
                        if (doc.exists && doc.data().resetDay) {
                            setResetDay(doc.data().resetDay);
                            setLocalResetDay(doc.data().resetDay);
                        }
                    });
                    unsub1 = userRef.collection('incomes').onSnapshot(s => setIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub2 = userRef.collection('expenses').onSnapshot(s => setExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub3 = userRef.collection('fixed_settings').onSnapshot(s => setFixedExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub4 = userRef.collection('fixed_incomes').onSnapshot(s => setFixedIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                } catch (e) {
                    console.error("Firebase Sync Error", e);
                }
                
                return () => { unsubSettings(); unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const cycleData = useMemo(() => {
                try {
                    const now = new Date();
                    let startDate = new Date(now.getFullYear(), now.getMonth(), resetDay || 1);
                    if (now.getDate() < (resetDay || 1)) startDate.setMonth(startDate.getMonth() - 1);
                    
                    const curVarInc = incomes.filter(i => new Date(i.date) >= startDate);
                    const curVarExp = expenses.filter(i => new Date(i.date) >= startDate);
                    const totalInc = curVarInc.reduce((s, i) => s + Number(i.amount || 0), 0) + fixedIncomes.reduce((s, i) => s + Number(i.amount || 0), 0);
                    const totalFixedExp = fixedExpenses.reduce((s, i) => s + Number(i.amount || 0), 0);
                    const totalVarExp = curVarExp.reduce((s, i) => s + Number(i.amount || 0), 0);
                    
                    return { totalIncome: totalInc, totalFixedExp, totalVarExp, balance: totalInc - totalFixedExp - totalVarExp, filteredIncomes: curVarInc, filteredExpenses: curVarExp };
                } catch (e) {
                    return { totalIncome: 0, totalFixedExp: 0, totalVarExp: 0, balance: 0, filteredIncomes: [], filteredExpenses: [] };
                }
            }, [incomes, expenses, fixedExpenses, fixedIncomes, resetDay]);

            const handleAddItem = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = modalType === 'income' ? 'incomes' : 'expenses';
                await db.collection('users').doc(user.uid).collection(col).add({ amount: Number(formData.get('amount')), description: formData.get('description'), date: new Date().toISOString() });
                setIsModalOpen(false);
            };

            const handleAddFixed = async (e, type) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = type === 'income' ? 'fixed_incomes' : 'fixed_settings';
                await db.collection('users').doc(user.uid).collection(col).add({ name: formData.get('name'), amount: Number(formData.get('amount')) });
                e.target.reset();
            };

            const saveResetDay = async () => { 
                if (localResetDay >= 1 && localResetDay <= 31) {
                    await db.collection('users').doc(user.uid).set({ resetDay: localResetDay }, { merge: true });
                }
            };

            const deleteItem = async (col, id) => await db.collection('users').doc(user.uid).collection(col).doc(id).delete();

            if (loading) return (
                <div className="min-h-screen flex flex-col justify-center items-center gap-4 text-brand-turquoise">
                    <Icon name="loader-2" className="animate-spin" size={40} />
                    <span className="font-medium">טוען...</span>
                </div>
            );
            
            if (!user) return <LoginScreen />;

            return (
                <div className="min-h-screen pb-32 relative z-10">
                    <div className="ambient-light"></div>
                    
                    <header className="px-6 pt-10 pb-6 animate-rise">
                        <div className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 rounded-full p-[2px] bg-white shadow-sm border border-slate-100">
                                    <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="rounded-full w-full h-full object-cover" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-light-text">שלום, {user.displayName ? user.displayName.split(' ')[0] : 'משתמש'}</h1>
                                    <h2 className="text-sm font-medium text-light-muted">התקציב המשפחתי</h2>
                                </div>
                            </div>
                            <button onClick={() => auth.signOut()} className="hover-float bg-white border border-slate-200 p-3 rounded-full text-slate-400 shadow-sm"><Icon name="log-out" size={18}/></button>
                        </div>

                        <div className="spatial-module p-8 rounded-[2.5rem] text-center relative overflow-hidden">
                            <span className="text-brand-gold text-sm font-medium">יתרה פנויה לניצול</span>
                            <h2 className={`text-6xl font-bold mt-2 ${cycleData.balance >= 0 ? 'text-brand-turquoise' : 'text-brand-red'}`}>
                                ₪{cycleData.balance.toLocaleString()}
                            </h2>
                        </div>

                        <div className="grid grid-cols-3 gap-4 mt-6">
                            <div className="spatial-module p-5 rounded-[2rem] text-center hover-float">
                                <p className="text-xs text-light-muted font-medium mb-1">הכנסות</p>
                                <p className="text-brand-turquoise font-bold text-lg">₪{cycleData.totalIncome}</p>
                            </div>
                            <div className="spatial-module p-5 rounded-[2rem] text-center hover-float">
                                <p className="text-xs text-light-muted font-medium mb-1">קבועות</p>
                                <p className="text-light-text font-bold text-lg">₪{cycleData.totalFixedExp}</p>
                            </div>
                            <div className="spatial-module p-5 rounded-[2rem] text-center hover-float">
                                <p className="text-xs text-light-muted font-medium mb-1">משתנות</p>
                                <p className="text-brand-red font-bold text-lg">₪{cycleData.totalVarExp}</p>
                            </div>
                        </div>
                    </header>

                    <main className="px-6 mt-4 space-y-10 animate-rise" style={{animationDelay: '0.1s'}}>
                        {view === 'dashboard' ? (
                            <>
                                <section>
                                    <h3 className="font-bold text-lg text-light-text mb-4 ml-2">פעולות מהירות</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={() => { setModalType('income'); setIsModalOpen(true); }} className="hover-float spatial-module rounded-[2rem] p-6 flex flex-col items-center justify-center gap-3">
                                            <div className="bg-teal-50 text-brand-turquoise p-4 rounded-full"><Icon name="arrow-up" size={28} strokeWidth={2.5} /></div>
                                            <span className="text-brand-turquoise font-bold text-lg">הכנסה</span>
                                        </button>
                                        <button onClick={() => { setModalType('expense'); setIsModalOpen(true); }} className="hover-float spatial-module rounded-[2rem] p-6 flex flex-col items-center justify-center gap-3">
                                            <div className="bg-rose-50 text-brand-red p-4 rounded-full"><Icon name="arrow-down" size={28} strokeWidth={2.5} /></div>
                                            <span className="text-brand-red font-bold text-lg">הוצאה</span>
                                        </button>
                                    </div>
                                </section>

                                <section>
                                    <h3 className="font-bold text-lg text-light-text mb-4 ml-2">תנועות אחרונות</h3>
                                    <div className="space-y-3">
                                        {(() => {
                                            const combined = [...cycleData.filteredIncomes, ...cycleData.filteredExpenses].sort((a,b) => new Date(b.date) - new Date(a.date));
                                            if (combined.length === 0) return <div className="spatial-module p-6 text-center rounded-[2rem] text-slate-400 font-medium">אין תנועות עדיין החודש.</div>;
                                            return combined.map(item => {
                                                const isInc = incomes.some(i => i.id === item.id);
                                                return (
                                                    <div key={item.id} className="spatial-module p-4 rounded-[1.5rem] flex justify-between items-center hover-float">
                                                        <div className="flex items-center gap-4">
                                                            <div className={`p-3 rounded-2xl ${isInc ? 'bg-teal-50 text-brand-turquoise' : 'bg-rose-50 text-brand-red'}`}>
                                                                <Icon name={isInc ? "plus" : "minus"} size={18} strokeWidth={2.5} />
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-light-text">{item.description}</p>
                                                                <p className="text-[11px] text-light-muted mt-0.5">{new Date(item.date).toLocaleDateString('he-IL')}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className={`font-bold text-lg ${isInc ? 'text-brand-turquoise' : 'text-light-text'}`}>₪{item.amount}</span>
                                                            <button onClick={() => deleteItem(isInc ? 'incomes' : 'expenses', item.id)} className="text-slate-300 hover:text-brand-red transition-colors p-2"><Icon name="trash-2" size={18} /></button>
                                                        </div>
                                                    </div>
                                                );
                                            });
                                        })()}
                                    </div>
                                </section>
                            </>
                        ) : (
                            <section className="space-y-8 animate-rise">
                                <div className="spatial-module p-8 rounded-[2.5rem]">
                                    <h3 className="font-bold text-xl text-light-text mb-2 flex items-center gap-2"><Icon name="calendar" className="text-brand-turquoise"/> מתי החודש מתחיל?</h3>
                                    <p className="text-light-muted text-sm mb-6">באיזה יום בחודש תרצה שהתקציב יתאפס ויתחיל מחדש?</p>
                                    <div className="flex items-center gap-4 bg-slate-50 p-2 rounded-2xl border border-slate-100 w-fit">
                                        <input type="number" min="1" max="31" value={localResetDay} onChange={(e) => setLocalResetDay(Number(e.target.value))} onBlur={saveResetDay} className="bg-transparent text-center text-xl font-bold w-16 outline-none text-light-text" />
                                        <span className="font-medium text-light-muted pl-4">לחודש</span>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-lg text-brand-turquoise mb-4 ml-2">הכנסות קבועות</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'income')} className="spatial-module p-6 rounded-[2.5rem] space-y-4">
                                        <input name="name" required className="clean-input" placeholder="שם ההכנסה (למשל: משכורת)" />
                                        <input name="amount" type="number" required className="clean-input" placeholder="סכום (₪)" />
                                        <button type="submit" className="hover-float w-full bg-teal-50 text-brand-turquoise p-4 rounded-2xl font-bold">הוסף הכנסה</button>
                                    </form>
                                    <div className="mt-4 space-y-3">{fixedIncomes.map(item => (
                                        <div key={item.id} className="spatial-module p-4 rounded-2xl flex justify-between items-center"><p className="font-medium text-light-text">{item.name}</p><div className="flex gap-4"><span className="text-brand-turquoise font-bold">₪{item.amount}</span><button onClick={() => deleteItem('fixed_incomes', item.id)} className="text-slate-300 hover:text-brand-red"><Icon name="x" size={18}/></button></div></div>
                                    ))}</div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-lg text-brand-red mb-4 ml-2">הוצאות קבועות</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'expense')} className="spatial-module p-6 rounded-[2.5rem] space-y-4">
                                        <input name="name" required className="clean-input" placeholder="שם ההוצאה (למשל: שכירות)" />
                                        <input name="amount" type="number" required className="clean-input" placeholder="סכום (₪)" />
                                        <button type="submit" className="hover-float w-full bg-rose-50 text-brand-red p-4 rounded-2xl font-bold">הוסף הוצאה</button>
                                    </form>
                                    <div className="mt-4 space-y-3">{fixedExpenses.map(item => (
                                        <div key={item.id} className="spatial-module p-4 rounded-2xl flex justify-between items-center"><p className="font-medium text-light-text">{item.name}</p><div className="flex gap-4"><span className="font-bold">₪{item.amount}</span><button onClick={() => deleteItem('fixed_settings', item.id)} className="text-slate-300 hover:text-brand-red"><Icon name="x" size={18}/></button></div></div>
                                    ))}</div>
                                </div>
                            </section>
                        )}
                    </main>

                    <nav className="fixed bottom-6 left-6 right-6 spatial-module p-4 flex justify-around rounded-[2rem] z-40">
                        <button onClick={() => setView('dashboard')} className={`hover-float flex flex-col items-center transition-all ${view === 'dashboard' ? 'text-brand-turquoise' : 'text-slate-400'}`}><Icon name="layout-grid" size={24} /><span className="text-xs font-bold mt-1">ראשי</span></button>
                        <button onClick={() => setView('settings')} className={`hover-float flex flex-col items-center transition-all ${view === 'settings' ? 'text-brand-turquoise' : 'text-slate-400'}`}><Icon name="settings" size={24} /><span className="text-xs font-bold mt-1">הגדרות</span></button>
                    </nav>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center">
                            <div className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" onClick={() => setIsModalOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-white rounded-t-[3rem] p-8 animate-rise shadow-[0_-20px_40px_rgba(0,0,0,0.1)]">
                                <div className="w-16 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
                                <h3 className="text-2xl font-bold text-center mb-8 text-light-text">{modalType === 'income' ? 'הכנסה חדשה' : 'הוצאה חדשה'}</h3>
                                <form onSubmit={handleAddItem} className="space-y-6">
                                    <div className="relative">
                                        <span className={`absolute left-6 top-1/2 -translate-y-1/2 text-3xl font-bold ${modalType === 'income' ? 'text-brand-turquoise' : 'text-brand-red'}`}>₪</span>
                                        <input name="amount" type="number" required autoFocus className={`w-full text-6xl font-bold text-center py-8 bg-slate-50 rounded-[2rem] border transition-all ${modalType === 'income' ? 'text-brand-turquoise border-teal-100 focus:border-brand-turquoise focus:bg-white' : 'text-brand-red border-rose-100 focus:border-brand-red focus:bg-white'} outline-none`} placeholder="0" />
                                    </div>
                                    <input name="description" required className="clean-input text-center text-lg" placeholder="על מה מדובר?" />
                                    <button type="submit" className={`hover-float w-full p-6 rounded-[1.5rem] font-bold text-xl shadow-md ${modalType === 'income' ? 'bg-brand-turquoise text-white shadow-teal-500/30' : 'bg-brand-red text-white shadow-rose-500/30'}`}>שמור</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
