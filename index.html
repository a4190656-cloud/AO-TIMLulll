<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO ניהול תקציב!</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ao: {
                            dark: '#0B0F19',
                            card: '#151C2C',
                            border: '#2A344A',
                            gold: '#D4AF37',
                            green: '#10B981',
                            red: '#F43F5E'
                        }
                    },
                    boxShadow: {
                        'ao-glow': '0 0 20px rgba(212, 175, 55, 0.15)',
                        'ao-card': '0 10px 30px rgba(0, 0, 0, 0.5)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .btn-press { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-press:active { transform: scale(0.95); opacity: 0.9; }

        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2A344A;
            border-radius: 1.25rem;
            padding: 1rem 1.25rem;
            width: 100%;
            outline: none;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .glass-input:focus { border-color: #D4AF37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqpLOIbztpurGuUqpfaWZT71JcofKG2rc",
            authDomain: "riki-aharele-budget.firebaseapp.com",
            projectId: "riki-aharele-budget",
            storageBucket: "riki-aharele-budget.firebasestorage.app",
            messagingSenderId: "53506652532",
            appId: "1:53506652532:web:28b3e3fc28114b1feb9421"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const LoginScreen = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');

            const handleGoogleLogin = async () => {
                try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } 
                catch (err) { setError("שגיאה בחיבור לגוגל."); }
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
                    else await auth.signInWithEmailAndPassword(email, password);
                } catch (err) { setError('שגיאה בפרטי ההתחברות.'); }
            };

            return (
                <div className="min-h-screen bg-ao-dark flex flex-col items-center justify-center p-8 text-center">
                    <div className="animate-pop w-full max-w-sm">
                        <div className="mx-auto w-32 h-32 rounded-full border-2 border-ao-border p-1 bg-ao-card shadow-ao-glow mb-6 overflow-hidden">
                            <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full object-cover" />
                        </div>
                        <h1 className="text-4xl font-black italic mb-2">AO ניהול תקציב</h1>
                        <p className="text-slate-400 font-medium mb-10 text-sm">ניהול כלכלי ברמה אחרת.</p>

                        <div className="space-y-5">
                            <button onClick={handleGoogleLogin} className="btn-press w-full bg-white text-ao-dark p-4 rounded-2xl font-black flex items-center justify-center gap-3">
                                <span className="text-xl">🚀</span> התחברות עם גוגל
                            </button>
                            <div className="flex items-center gap-4 text-slate-600"><div className="h-px bg-ao-border flex-1"></div><span className="text-xs">או עם מייל</span><div className="h-px bg-ao-border flex-1"></div></div>
                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                <input type="email" placeholder="אימייל" className="glass-input" value={email} onChange={e => setEmail(e.target.value)} required />
                                <input type="password" placeholder="סיסמה" className="glass-input" value={password} onChange={e => setPassword(e.target.value)} required />
                                {error && <p className="text-ao-red text-xs font-bold">{error}</p>}
                                <button type="submit" className="btn-press w-full bg-ao-card border border-ao-border text-white p-4 rounded-2xl font-bold">
                                    {isRegister ? 'יצירת חשבון' : 'כניסה'}
                                </button>
                            </form>
                            <button onClick={() => setIsRegister(!isRegister)} className="text-slate-500 text-sm font-medium underline mt-4">
                                {isRegister ? 'כבר יש חשבון? התחבר' : 'הרשמה לחשבון חדש'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [resetDay, setResetDay] = useState(1);
            
            const [incomes, setIncomes] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [fixedExpenses, setFixedExpenses] = useState([]);
            const [fixedIncomes, setFixedIncomes] = useState([]);
            
            const [view, setView] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('income');

            useEffect(() => {
                return auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const userRef = db.collection('users').doc(user.uid);
                
                const unsubSettings = userRef.onSnapshot(doc => {
                    if (doc.exists && doc.data().resetDay) setResetDay(doc.data().resetDay);
                });

                const unsub1 = userRef.collection('incomes').onSnapshot(s => setIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub2 = userRef.collection('expenses').onSnapshot(s => setExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub3 = userRef.collection('fixed_settings').onSnapshot(s => setFixedExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub4 = userRef.collection('fixed_incomes').onSnapshot(s => setFixedIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                
                return () => { unsubSettings(); unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const cycleData = useMemo(() => {
                const now = new Date();
                let startDate = new Date(now.getFullYear(), now.getMonth(), resetDay);
                if (now.getDate() < resetDay) startDate.setMonth(startDate.getMonth() - 1);

                const curVarInc = incomes.filter(i => new Date(i.date) >= startDate);
                const curVarExp = expenses.filter(i => new Date(i.date) >= startDate);

                const totalInc = curVarInc.reduce((s, i) => s + Number(i.amount || 0), 0) + fixedIncomes.reduce((s, i) => s + Number(i.amount || 0), 0);
                const totalFixedExp = fixedExpenses.reduce((s, i) => s + Number(i.amount || 0), 0);
                const totalVarExp = curVarExp.reduce((s, i) => s + Number(i.amount || 0), 0);

                return { totalIncome: totalInc, totalFixedExp, totalVarExp, balance: totalInc - totalFixedExp - totalVarExp, filteredIncomes: curVarInc, filteredExpenses: curVarExp };
            }, [incomes, expenses, fixedExpenses, fixedIncomes, resetDay]);

            const handleAddItem = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = modalType === 'income' ? 'incomes' : 'expenses';
                await db.collection('users').doc(user.uid).collection(col).add({
                    amount: Number(formData.get('amount')),
                    description: formData.get('description'),
                    date: new Date().toISOString()
                });
                setIsModalOpen(false);
            };

            const handleAddFixed = async (e, type) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = type === 'income' ? 'fixed_incomes' : 'fixed_settings';
                await db.collection('users').doc(user.uid).collection(col).add({
                    name: formData.get('name'), amount: Number(formData.get('amount'))
                });
                e.target.reset();
            };

            const saveResetDay = async (newDay) => {
                if (newDay >= 1 && newDay <= 31) {
                    await db.collection('users').doc(user.uid).set({ resetDay: newDay }, { merge: true });
                }
            };

            const deleteItem = async (col, id) => await db.collection('users').doc(user.uid).collection(col).doc(id).delete();

            if (loading) return <div className="min-h-screen bg-ao-dark flex justify-center items-center"><Icon name="loader-2" className="animate-spin text-ao-gold" size={40} /></div>;
            if (!user) return <LoginScreen />;

            return (
                <div className="min-h-screen pb-32 bg-[#06090F]">
                    <header className="bg-ao-card rounded-b-[2.5rem] shadow-ao-card relative z-10 pb-8 pt-10 px-6 border-b border-ao-border animate-fade-in-up">
                        <div className="flex justify-between items-start mb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 rounded-full p-0.5 bg-gradient-to-tr from-ao-gold to-yellow-200">
                                    <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="rounded-full w-full h-full object-cover border-2 border-ao-card" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold">שלום, {user.displayName ? user.displayName.split(' ')[0] : 'משתמש'}</h1>
                                    <p className="text-slate-400 text-xs italic">ניהול חכם מה-{resetDay} לחודש</p>
                                </div>
                            </div>
                            <button onClick={() => auth.signOut()} className="btn-press bg-ao-dark p-3 rounded-full text-slate-400"><Icon name="log-out" size={18}/></button>
                        </div>

                        <div className="text-center mb-8 mt-4">
                            <span className="text-slate-400 text-sm font-bold uppercase tracking-widest italic">יתרה זמינה</span>
                            <h2 className={`text-6xl font-black tracking-tight mt-1 ${cycleData.balance >= 0 ? 'text-ao-green' : 'text-ao-red'} drop-shadow-lg`}>
                                ₪{cycleData.balance.toLocaleString()}
                            </h2>
                        </div>

                        <div className="grid grid-cols-3 gap-3">
                            <div className="bg-ao-dark border border-ao-border p-4 rounded-2xl text-center shadow-inner">
                                <p className="text-[10px] text-slate-500 mb-1 font-bold">הכנסות</p>
                                <p className="text-ao-green font-black text-lg">₪{cycleData.totalIncome}</p>
                            </div>
                            <div className="bg-ao-dark border border-ao-border p-4 rounded-2xl text-center shadow-inner">
                                <p className="text-[10px] text-slate-500 mb-1 font-bold">קבועות</p>
                                <p className="text-white font-black text-lg">₪{cycleData.totalFixedExp}</p>
                            </div>
                            <div className="bg-ao-dark border border-ao-border p-4 rounded-2xl text-center shadow-inner">
                                <p className="text-[10px] text-slate-500 mb-1 font-bold">משתנות</p>
                                <p className="text-ao-red font-black text-lg">₪{cycleData.totalVarExp}</p>
                            </div>
                        </div>
                    </header>

                    <main className="px-6 mt-8 space-y-10 animate-fade-in-up" style={{animationDelay: '0.1s'}}>
                        {view === 'dashboard' ? (
                            <>
                                <section>
                                    <h3 className="font-bold text-xl mb-4 text-white italic">פעולות מהירות</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={() => { setModalType('income'); setIsModalOpen(true); }} className="btn-press bg-[#0A261C] border border-[#13422F] rounded-[2.5rem] p-6 flex flex-col items-center justify-center gap-3 shadow-xl">
                                            <div className="bg-ao-green/20 p-3 rounded-full text-ao-green"><Icon name="arrow-up" size={28} strokeWidth={3} /></div>
                                            <span className="text-ao-green font-black text-lg">הכנסה</span>
                                        </button>
                                        <button onClick={() => { setModalType('expense'); setIsModalOpen(true); }} className="btn-press bg-[#2B0E15] border border-[#4B1724] rounded-[2.5rem] p-6 flex flex-col items-center justify-center gap-3 shadow-xl">
                                            <div className="bg-ao-red/20 p-3 rounded-full text-ao-red"><Icon name="arrow-down" size={28} strokeWidth={3} /></div>
                                            <span className="text-ao-red font-black text-lg">הוצאה</span>
                                        </button>
                                    </div>
                                </section>

                                <section>
                                    <h3 className="font-bold text-xl mb-4 text-white italic">תנועות אחרונות</h3>
                                    <div className="space-y-3">
                                        {(() => {
                                            const combined = [...cycleData.filteredIncomes, ...cycleData.filteredExpenses].sort((a,b) => new Date(b.date) - new Date(a.date));
                                            if (combined.length === 0) return <p className="text-center text-slate-600 py-10 font-bold">אין תנועות. תכניס משהו פגז!</p>;
                                            return combined.map(item => {
                                                const isInc = incomes.some(i => i.id === item.id);
                                                return (
                                                    <div key={item.id} className="bg-ao-card border border-ao-border p-4 rounded-2xl flex justify-between items-center animate-fade-in-up shadow-lg">
                                                        <div className="flex items-center gap-4">
                                                            <div className={`p-3 rounded-xl ${isInc ? 'bg-ao-green/10 text-ao-green' : 'bg-ao-red/10 text-ao-red'}`}>
                                                                <Icon name={isInc ? "plus" : "minus"} size={18} strokeWidth={3} />
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-sm text-white">{item.description}</p>
                                                                <p className="text-[10px] text-slate-500">{new Date(item.date).toLocaleDateString('he-IL')}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className={`font-black text-lg ${isInc ? 'text-ao-green' : 'text-white'}`}>₪{item.amount}</span>
                                                            <button onClick={() => deleteItem(isInc ? 'incomes' : 'expenses', item.id)} className="text-slate-700 hover:text-ao-red p-2"><Icon name="trash-2" size={16} /></button>
                                                        </div>
                                                    </div>
                                                );
                                            });
                                        })()}
                                    </div>
                                </section>
                            </>
                        ) : (
                            <section className="space-y-10">
                                <div className="bg-ao-card p-6 rounded-[2rem] border border-ao-border shadow-xl">
                                    <h3 className="font-bold text-xl text-white mb-2 flex items-center gap-2"><Icon name="calendar-sync" className="text-ao-gold"/> יום איפוס חודשי</h3>
                                    <p className="text-slate-400 text-sm mb-5">הגדר באיזה יום בחודש יתאפסו הנתונים המשתנים.</p>
                                    <div className="flex items-center gap-4">
                                        <input type="number" min="1" max="31" value={resetDay} onChange={(e) => saveResetDay(Number(e.target.value))} className="glass-input text-center text-xl w-24" />
                                        <span className="font-bold text-slate-300">בכל חודש</span>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-xl text-white mb-4 italic">הכנסות קבועות</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'income')} className="bg-ao-card p-5 rounded-[2rem] space-y-4 border border-ao-border">
                                        <input name="name" required className="glass-input" placeholder="מקור (למשל: משכורת)" />
                                        <input name="amount" type="number" required className="glass-input" placeholder="סכום קבוע" />
                                        <button type="submit" className="btn-press w-full bg-ao-dark border border-ao-green/30 text-ao-green p-4 rounded-xl font-bold">הוסף קבועה</button>
                                    </form>
                                    <div className="mt-4 space-y-2">{fixedIncomes.map(item => (
                                        <div key={item.id} className="bg-ao-dark p-4 rounded-xl flex justify-between items-center border border-ao-border"><p className="font-bold text-slate-300">{item.name}</p><div className="flex gap-4"><span className="text-ao-green font-bold">₪{item.amount}</span><button onClick={() => deleteItem('fixed_incomes', item.id)} className="text-slate-700"><Icon name="x" size={18}/></button></div></div>
                                    ))}</div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-xl text-white mb-4 italic">הוצאות קבועות</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'expense')} className="bg-ao-card p-5 rounded-[2rem] space-y-4 border border-ao-border">
                                        <input name="name" required className="glass-input" placeholder="שם ההוצאה" />
                                        <input name="amount" type="number" required className="glass-input" placeholder="סכום קבוע" />
                                        <button type="submit" className="btn-press w-full bg-ao-dark border border-ao-red/30 text-ao-red p-4 rounded-xl font-bold">הוסף קבועה</button>
                                    </form>
                                    <div className="mt-4 space-y-2">{fixedExpenses.map(item => (
                                        <div key={item.id} className="bg-ao-dark p-4 rounded-xl flex justify-between items-center border border-ao-border"><p className="font-bold text-slate-300">{item.name}</p><div className="flex gap-4"><span>₪{item.amount}</span><button onClick={() => deleteItem('fixed_settings', item.id)} className="text-slate-700"><Icon name="x" size={18}/></button></div></div>
                                    ))}</div>
                                </div>
                            </section>
                        )}
                    </main>

                    <nav className="fixed bottom-6 left-6 right-6 bg-ao-card/90 backdrop-blur-2xl border border-ao-border p-4 flex justify-around rounded-[2.5rem] z-40 shadow-2xl">
                        <button onClick={() => setView('dashboard')} className={`btn-press flex flex-col items-center transition-all ${view === 'dashboard' ? 'text-ao-gold scale-110' : 'text-slate-600'}`}><Icon name="layout-dashboard" size={24} /><span className="text-[10px] font-bold mt-1">ראשי</span></button>
                        <button onClick={() => setView('settings')} className={`btn-press flex flex-col items-center transition-all ${view === 'settings' ? 'text-ao-gold scale-110' : 'text-slate-600'}`}><Icon name="settings-2" size={24} /><span className="text-[10px] font-bold mt-1">הגדרות</span></button>
                    </nav>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsModalOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-ao-card rounded-t-[3rem] p-8 animate-fade-in-up border-t border-ao-border shadow-2xl">
                                <div className="w-12 h-1.5 bg-slate-800 rounded-full mx-auto mb-8 opacity-50"></div>
                                <h3 className="text-2xl font-black text-center mb-8 text-white italic">{modalType === 'income' ? 'הכנסה חדשה' : 'הוצאה חדשה'}</h3>
                                <form onSubmit={handleAddItem} className="space-y-6">
                                    <div className="relative">
                                        <span className={`absolute left-8 top-1/2 -translate-y-1/2 text-3xl font-black ${modalType === 'income' ? 'text-ao-green' : 'text-ao-red'}`}>₪</span>
                                        <input name="amount" type="number" required autoFocus className={`w-full text-6xl font-black text-center py-8 bg-ao-dark rounded-[2rem] outline-none border border-ao-border transition-all ${modalType === 'income' ? 'text-ao-green focus:border-ao-green' : 'text-ao-red focus:border-ao-red'}`} placeholder="0" />
                                    </div>
                                    <input name="description" required className="glass-input bg-ao-dark text-center text-lg" placeholder="תיאור הפעולה..." />
                                    <button type="submit" className={`btn-press w-full p-6 rounded-[1.5rem] font-black text-xl shadow-2xl ${modalType === 'income' ? 'bg-ao-green text-ao-dark' : 'bg-ao-red text-white'}`}>שמור וסגור</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
