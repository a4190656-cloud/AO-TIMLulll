<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AO Banking | Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* פלטת צבעים נקייה יותר */
      --bg:      #0B101B; /* רקע כחול עמוק מאוד */
      --card:    #161C2A; /* כרטיס מעט יותר בהיר */
      --accent:  #00F5FF; /* טורקיז נקי */
      --green:   #2DFF94; /* ירוק רענן מהתמונה שלך */
      --red:     #FF4B6B;
      --text:    #FFFFFF;
      --muted:   #8E9AAF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Assistant', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      line-height: 1.6;
    }

    #app { padding: 20px 20px 120px; max-width: 500px; margin: 0 auto; }

    /* כרטיס היתרה הראשי - בהשראת התמונה */
    .hero-card {
      background: linear-gradient(180deg, #161C2A 0%, #0B101B 100%);
      border-radius: 35px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .balance-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .balance-amount {
      font-family: 'Heebo', sans-serif;
      font-size: 58px;
      font-weight: 900;
      color: var(--green); /* הירוק מהצילום מסך */
      letter-spacing: -2px;
    }

    /* כרטיסי תוכן מעוגלים */
    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 15px;
      color: var(--text);
      padding-right: 5px;
    }

    /* אינפוטים בסגנון התמונה ששלחת */
    .inp {
      width: 100%;
      background: #FFFFFF;
      border-radius: 18px;
      border: 2px solid #E0E0E0;
      padding: 16px;
      color: #161C2A;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .inp:focus {
      border-color: var(--green);
    }

    /* כפתור הוספה מאסיבי */
    .btn-add {
      background: var(--green);
      color: #0B101B;
      width: 100%;
      padding: 18px;
      border-radius: 20px;
      border: none;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(45, 255, 148, 0.15);
      transition: transform 0.1s;
    }

    .btn-add:active { transform: scale(0.98); }

    /* שורות תנועה נקיות */
    .tx-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .tx-info { display: flex; align-items: center; gap: 15px; }
    
    .tx-icon-circle {
      width: 45px;
      height: 45px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tx-name { font-weight: 700; font-size: 15px; }
    .tx-date { font-size: 12px; color: var(--muted); }
    .tx-amount { font-family: 'Heebo'; font-weight: 800; font-size: 16px; }

    /* תפריט ניווט תחתון "צף" */
    #nav {
      position: fixed;
      bottom: 25px;
      left: 20px;
      right: 20px;
      background: rgba(22, 28, 42, 0.9);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      display: flex;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
    }

    .nav-btn {
      flex: 1;
      padding: 15px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .nav-btn.active {
      color: var(--accent);
      background: rgba(255,255,255,0.05);
      border-radius: 25px;
    }

    /* סטטיסטיקה מהירה */
    .quick-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat-item {
      background: var(--card);
      padding: 15px 10px;
      border-radius: 22px;
      text-align: center;
    }

    .stat-val { font-family: 'Heebo'; font-weight: 800; font-size: 14px; display: block; }
    .stat-lab { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 700; }

  </style>
</head>
<body>

<div id="app">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
    <div>
      <h2 style="font-size: 24px; font-weight: 900;">היי אהרון 👋</h2>
      <p style="color: var(--muted); font-size: 14px;">הנה מצב החשבון שלך</p>
    </div>
    <div style="width:50px; height:50px; border-radius:15px; overflow:hidden; border: 2px solid var(--accent);">
       <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" style="width:100%; height:100%; object-fit:cover;">
    </div>
  </div>

  <div class="hero-card">
    <p class="balance-label">יתרה פנויה לשימוש</p>
    <h1 class="balance-amount" id="balance-display">₪4,100</h1>
  </div>

  <div class="quick-stats">
    <div class="stat-item">
      <span class="stat-lab">הכנסות</span>
      <span class="stat-val" style="color: var(--green);">₪12,000</span>
    </div>
    <div class="stat-item">
      <span class="stat-lab">הוצאות</span>
      <span class="stat-val" style="color: var(--red);">₪7,900</span>
    </div>
    <div class="stat-item">
      <span class="stat-lab">חסכון</span>
      <span class="stat-val" style="color: var(--accent);">₪1,500</span>
    </div>
  </div>

  <div class="card">
    <h3 class="section-title">הכנסה קבועה חדשה</h3>
    <input type="text" class="inp" placeholder="הסעות עירייה משכורת">
    <input type="number" class="inp" placeholder="4100" style="color: var(--green);">
    <button class="btn-add">הוסף הכנסה קבועה</button>
  </div>

  <h3 class="section-title">תנועות אחרונות</h3>
  <div class="card" style="padding: 10px 20px;">
    <div class="tx-row">
      <div class="tx-info">
        <div class="tx-icon-circle">🛒</div>
        <div>
          <p class="tx-name">סופר מרקט</p>
          <p class="tx-date">היום, 14:20</p>
        </div>
      </div>
      <span class="tx-amount" style="color:var(--red)">- ₪350</span>
    </div>
    <div class="tx-row" style="border:none">
      <div class="tx-info">
        <div class="tx-icon-circle">💰</div>
        <div>
          <p class="tx-name">העברה מריקי</p>
          <p class="tx-date">אתמול</p>
        </div>
      </div>
      <span class="tx-amount" style="color:var(--green)">+ ₪1,200</span>
    </div>
  </div>

  <nav id="nav">
    <button class="nav-btn active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      ראשי
    </button>
    <button class="nav-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
      תקציב
    </button>
    <button class="nav-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      הגדרות
    </button>
  </nav>
</div>

</body>
</html>
