<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO ניהול תקציב</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#06090F', card: '#111724', surface: '#161D2D' },
                        bank: {
                            balance: '#00E5FF',
                            income: '#00E676',
                            expense: '#FF1744'
                        }
                    },
                    boxShadow: {
                        'glow-balance': '0 0 25px -5px rgba(0, 229, 255, 0.3)',
                        'glow-income': '0 0 20px -5px rgba(0, 230, 118, 0.3)',
                        'glow-expense': '0 0 20px -5px rgba(255, 23, 68, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #06090F;
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bank-card {
            background: linear-gradient(145deg, rgba(28, 37, 56, 0.8) 0%, rgba(15, 21, 33, 0.98) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 35px -12px rgba(0,0,0,0.6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bank-card-main {
            background: linear-gradient(135deg, #0F1521 0%, #06090F 100%);
            border-top: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 25px rgba(0, 229, 255, 0.05);
        }

        .premium-logo-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 1.2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 3px;
        }
        .premium-logo-box img { border-radius: 1rem; }

        .hover-press:active { transform: scale(0.96); opacity: 0.9; }

        .cyber-input {
            background: rgba(6, 9, 15, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.25rem;
            padding: 1.25rem;
            width: 100%;
            outline: none;
            color: #FFFFFF;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: right;
        }
        .cyber-input:focus { border-color: #00E5FF; box-shadow: 0 0 20px rgba(0, 229, 255, 0.1); background: rgba(17, 23, 36, 1); }

        @keyframes fadeInRise {
            from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .animate-rise { animation: fadeInRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); transform: scale(1); }
            70% { box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); transform: scale(1.1); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); transform: scale(1); }
        }
        .live-dot {
            width: 7px; height: 7px;
            background-color: #00E676;
            border-radius: 50%;
            animation: livePulse 2.5s infinite;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqpLOIbztpurGuUqpfaWZT71JcofKG2rc",
            authDomain: "riki-aharele-budget.firebaseapp.com",
            projectId: "riki-aharele-budget",
            storageBucket: "riki-aharele-budget.firebasestorage.app",
            messagingSenderId: "53506652532",
            appId: "1:53506652532:web:28b3e3fc28114b1feb9421"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                    const svg = spanRef.current.querySelector('svg');
                    if (svg) { svg.style.width = size + 'px'; svg.style.height = size + 'px'; }
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center"></span>;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError() { return { hasError: true }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-dark-bg">
                            <Icon name="shield-alert" className="text-bank-expense mb-4" size={48} />
                            <h1 className="text-2xl font-bold text-white mb-4">המערכת מסתנכרנת...</h1>
                            <button onClick={() => window.location.reload()} className="bg-bank-balance text-dark-bg px-8 py-3 rounded-2xl font-bold shadow-glow-balance">טען מחדש</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const LoginScreen = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
                    else await auth.signInWithEmailAndPassword(email, password);
                } catch (err) { setError('שגיאה בחיבור. בדוק את הפרטים.'); }
            };

            const handleGoogleLogin = async () => {
                try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } 
                catch (err) { console.error(err); }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-dark-bg">
                    <div className="w-full max-w-sm animate-rise">
                        <div className="flex flex-col items-center mb-10">
                            <div className="w-24 h-24 premium-logo-box mb-6">
                                <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full object-cover" />
                            </div>
                            <h1 className="text-3xl font-black text-white mb-1 tracking-tight">AO Banking</h1>
                            <p className="text-slate-400 text-sm font-medium opacity-80">התקציב האישי שלכם</p>
                        </div>

                        <div className="bank-card p-8 shadow-2xl">
                            <button onClick={handleGoogleLogin} className="hover-press w-full bg-white text-dark-bg p-4 rounded-2xl font-black flex items-center justify-center gap-3 mb-6 transition-all shadow-xl">
                                <Icon name="chrome" className="text-blue-500" /> כניסה מהירה עם גוגל
                            </button>

                            <div className="flex items-center gap-4 text-slate-600 mb-6">
                                <div className="h-px bg-slate-800 flex-1"></div>
                                <span className="text-[10px] font-black uppercase tracking-widest">או במייל</span>
                                <div className="h-px bg-slate-800 flex-1"></div>
                            </div>
                            
                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                <input type="email" placeholder="אימייל" className="cyber-input" value={email} onChange={e => setEmail(e.target.value)} required />
                                <input type="password" placeholder="סיסמא" className="cyber-input" value={password} onChange={e => setPassword(e.target.value)} required />
                                {error && <p className="text-bank-expense text-xs font-bold text-center">{error}</p>}
                                <button type="submit" className="hover-press w-full bg-bank-balance text-dark-bg p-4 rounded-2xl font-black transition-all mt-2 shadow-glow-balance">
                                    {isRegister ? 'צור חשבון בנקאי' : 'כניסה למערכת'}
                                </button>
                            </form>
                            <button onClick={() => setIsRegister(!isRegister)} className="text-slate-400 text-sm font-bold mt-6 hover:text-white transition-colors">
                                {isRegister ? 'כבר יש חשבון? התחבר' : 'הרשמה מהירה לחשבון חדש'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [resetDay, setResetDay] = useState(1);
            const [incomes, setIncomes] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [fixedExpenses, setFixedExpenses] = useState([]);
            const [fixedIncomes, setFixedIncomes] = useState([]);
            const [view, setView] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('income');

            useEffect(() => {
                return auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                let unsubSettings = () => {}; let unsub1 = () => {}; let unsub2 = () => {}; let unsub3 = () => {}; let unsub4 = () => {};
                try {
                    const userRef = db.collection('users').doc(user.uid);
                    unsubSettings = userRef.onSnapshot(doc => { if (doc.exists && doc.data().resetDay) setResetDay(doc.data().resetDay); });
                    unsub1 = userRef.collection('incomes').onSnapshot(s => setIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub2 = userRef.collection('expenses').onSnapshot(s => setExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub3 = userRef.collection('fixed_settings').onSnapshot(s => setFixedExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                    unsub4 = userRef.collection('fixed_incomes').onSnapshot(s => setFixedIncomes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                } catch (e) { console.error(e); }
                return () => { unsubSettings(); unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const cycleData = useMemo(() => {
                try {
                    const now = new Date();
                    let startDate = new Date(now.getFullYear(), now.getMonth(), resetDay || 1);
                    if (now.getDate() < (resetDay || 1)) startDate.setMonth(startDate.getMonth() - 1);
                    const curVarInc = incomes.filter(i => new Date(i.date) >= startDate);
                    const curVarExp = expenses.filter(i => new Date(i.date) >= startDate);
                    const totalInc = curVarInc.reduce((s, i) => s + Number(i.amount || 0), 0) + fixedIncomes.reduce((s, i) => s + Number(i.amount || 0), 0);
                    const totalFixedExp = fixedExpenses.reduce((s, i) => s + Number(i.amount || 0), 0);
                    const totalVarExp = curVarExp.reduce((s, i) => s + Number(i.amount || 0), 0);
                    return { totalIncome: totalInc, totalFixedExp, totalVarExp, balance: totalInc - totalFixedExp - totalVarExp, filteredIncomes: curVarInc, filteredExpenses: curVarExp };
                } catch (e) { return { totalIncome: 0, totalFixedExp: 0, totalVarExp: 0, balance: 0, filteredIncomes: [], filteredExpenses: [] }; }
            }, [incomes, expenses, fixedExpenses, fixedIncomes, resetDay]);

            const handleAddItem = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = modalType === 'income' ? 'incomes' : 'expenses';
                await db.collection('users').doc(user.uid).collection(col).add({ amount: Number(formData.get('amount')), description: formData.get('description'), date: new Date().toISOString() });
                setIsModalOpen(false);
            };

            const handleAddFixed = async (e, type) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const col = type === 'income' ? 'fixed_incomes' : 'fixed_settings';
                await db.collection('users').doc(user.uid).collection(col).add({ name: formData.get('name'), amount: Number(formData.get('amount')) });
                e.target.reset();
            };

            const deleteItem = async (col, id) => await db.collection('users').doc(user.uid).collection(col).doc(id).delete();

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-dark-bg">
                    <Icon name="loader-2" className="animate-spin text-bank-balance mb-5" size={44} />
                    <span className="text-slate-500 font-bold tracking-widest uppercase text-xs">Accessing Vault...</span>
                </div>
            );
            
            if (!user) return <LoginScreen />;
            const userName = user.displayName ? user.displayName.split(' ')[0] : (user.email ? user.email.split('@')[0] : 'משתמש');

            return (
                <div className="min-h-screen pb-32 bg-dark-bg relative">
                    <header className="px-5 pt-10 pb-2 animate-rise">
                        <div className="flex justify-between items-start mb-8">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 premium-logo-box">
                                    <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full object-cover" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-white tracking-tight">שלום, {userName}</h1>
                                    <div className="flex items-center gap-1.5 mt-0.5 opacity-80">
                                        <div className="live-dot"></div>
                                        <h2 className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">התקציב האישי שלכם</h2>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => window.location.reload()} className="p-2.5 bank-card hover-press text-slate-400">
                                    <Icon name="refresh-cw" size={18}/>
                                </button>
                                <button onClick={() => auth.signOut()} className="p-2.5 bank-card hover-press text-slate-400">
                                    <Icon name="log-out" size={18}/>
                                </button>
                            </div>
                        </div>

                        <div className="bank-card bank-card-main p-8 text-center mt-2 relative overflow-hidden group">
                            <div className="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-bank-balance/50 to-transparent"></div>
                            <span className="text-slate-500 font-bold text-xs uppercase tracking-widest">יתרה פנויה לניצול</span>
                            <h2 className={`text-6xl font-black mt-2 tracking-tighter ${cycleData.balance >= 0 ? 'text-bank-balance' : 'text-bank-expense'} drop-shadow-[0_0_20px_rgba(0,229,255,0.3)]`}>
                                ₪ {cycleData.balance.toLocaleString()}
                            </h2>
                        </div>
                    </header>

                    <main className="px-5 space-y-10 mt-6 animate-rise" style={{animationDelay: '0.1s'}}>
                        {view === 'dashboard' && (
                            <>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => { setModalType('income'); setIsModalOpen(true); }} className="hover-press bank-card p-6 flex flex-col items-center justify-center gap-3 border-b-2 border-b-bank-income/40">
                                        <div className="bg-bank-income/10 p-3.5 rounded-full"><Icon name="arrow-up" className="text-bank-income" size={24} /></div>
                                        <span className="text-white font-bold text-sm tracking-wide">הכנסה חדשה</span>
                                    </button>
                                    <button onClick={() => { setModalType('expense'); setIsModalOpen(true); }} className="hover-press bank-card p-6 flex flex-col items-center justify-center gap-3 border-b-2 border-b-bank-expense/40">
                                        <div className="bg-bank-expense/10 p-3.5 rounded-full"><Icon name="arrow-down" className="text-bank-expense" size={24} /></div>
                                        <span className="text-white font-bold text-sm tracking-wide">הוצאה חדשה</span>
                                    </button>
                                </div>

                                <section>
                                    <div className="flex justify-between items-end mb-5 px-1">
                                        <h3 className="font-bold text-lg text-white italic tracking-tight">תנועות אחרונות</h3>
                                        <span className="text-[10px] text-slate-500 font-black uppercase tracking-widest opacity-60">החודש הנוכחי</span>
                                    </div>
                                    
                                    <div className="bank-card overflow-hidden">
                                        {(() => {
                                            const combined = [...cycleData.filteredIncomes, ...cycleData.filteredExpenses].sort((a,b) => new Date(b.date) - new Date(a.date));
                                            if (combined.length === 0) return <div className="p-12 text-center text-slate-600 font-medium italic opacity-50">עוד לא הכנסת תנועות...</div>;
                                            return combined.map((item, index) => {
                                                const isInc = incomes.some(i => i.id === item.id);
                                                return (
                                                    <div key={item.id} className={`p-4 flex justify-between items-center ${index !== combined.length - 1 ? 'border-b border-white/[0.03]' : ''}`}>
                                                        <div className="flex items-center gap-4">
                                                            <div className={`p-2.5 rounded-xl bg-dark-bg border ${isInc ? 'border-bank-income/20 text-bank-income' : 'border-slate-800 text-slate-500'}`}>
                                                                <Icon name={isInc ? "arrow-up-right" : "arrow-down-left"} size={16} />
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-white text-sm tracking-wide">{item.description}</p>
                                                                <p className="text-[10px] text-slate-500 mt-0.5 font-medium">{new Date(item.date).toLocaleDateString('he-IL')}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-4">
                                                            <span className={`font-bold ${isInc ? 'text-bank-income' : 'text-white'} text-lg`} dir="ltr">
                                                                {isInc ? '+' : '-'}₪{item.amount.toLocaleString()}
                                                            </span>
                                                            <button onClick={() => deleteItem(isInc ? 'incomes' : 'expenses', item.id)} className="text-slate-700 hover:text-bank-expense transition-all p-1"><Icon name="trash-2" size={16} /></button>
                                                        </div>
                                                    </div>
                                                );
                                            });
                                        })()}
                                    </div>
                                </section>
                            </>
                        )}

                        {view === 'settings' && (
                            <section className="space-y-8 animate-rise">
                                <div className="bank-card p-6 border-t-2 border-t-bank-balance/20">
                                    <h3 className="font-bold text-lg text-white mb-2 flex items-center gap-2 tracking-tight"><Icon name="calendar" className="text-bank-balance" size={20}/> יום איפוס חודשי</h3>
                                    <p className="text-slate-400 text-sm mb-5 opacity-80 font-medium">הגדר מתי התקציב שלך מתחיל ספירה מחדש.</p>
                                    <div className="flex items-center gap-4 bg-dark-bg/50 p-2 rounded-2xl border border-white/5 w-fit">
                                        <input type="number" min="1" max="31" value={resetDay} onChange={(e) => {
                                            const v = Number(e.target.value);
                                            setResetDay(v);
                                            if(v >= 1 && v <= 31) db.collection('users').doc(user.uid).set({ resetDay: v }, { merge: true });
                                        }} className="bg-transparent text-center text-2xl font-black w-20 outline-none text-bank-balance" />
                                        <span className="font-bold text-slate-500 pl-4 text-sm uppercase tracking-widest">לחודש</span>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="font-bold text-lg text-white px-1 tracking-tight">ניהול הוראות קבע</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'expense')} className="bank-card p-6 space-y-4 border-l-4 border-l-bank-expense/30">
                                        <input name="name" required className="cyber-input" placeholder="שם החיוב (למשל: שכירות)" />
                                        <input name="amount" type="number" required className="cyber-input" placeholder="סכום קבוע (₪)" />
                                        <button type="submit" className="w-full bg-bank-surface border border-white/5 text-white p-4 rounded-2xl font-bold hover-press shadow-lg">הוסף הוצאה קבועה</button>
                                    </form>
                                    <div className="space-y-2">{fixedExpenses.map(item => (
                                        <div key={item.id} className="bank-card p-4 flex justify-between items-center"><p className="text-sm font-bold text-slate-200">{item.name}</p><div className="flex gap-4 items-center"><span className="font-bold text-bank-expense">₪{item.amount.toLocaleString()}</span><button onClick={() => deleteItem('fixed_settings', item.id)} className="text-slate-600"><Icon name="x" size={18}/></button></div></div>
                                    ))}</div>
                                </div>

                                <div className="space-y-4 pt-4">
                                    <h3 className="font-bold text-lg text-white px-1 tracking-tight">ניהול הכנסות קבועות</h3>
                                    <form onSubmit={(e) => handleAddFixed(e, 'income')} className="bank-card p-6 space-y-4 border-l-4 border-l-bank-income/30">
                                        <input name="name" required className="cyber-input" placeholder="מקור (למשל: משכורת בסיס)" />
                                        <input name="amount" type="number" required className="cyber-input" placeholder="סכום קבוע (₪)" />
                                        <button type="submit" className="w-full bg-bank-surface border border-white/5 text-white p-4 rounded-2xl font-bold hover-press shadow-lg">הוסף הכנסה קבועה</button>
                                    </form>
                                    <div className="space-y-2">{fixedIncomes.map(item => (
                                        <div key={item.id} className="bank-card p-4 flex justify-between items-center"><p className="text-sm font-bold text-slate-200">{item.name}</p><div className="flex gap-4 items-center"><span className="font-bold text-bank-income">₪{item.amount.toLocaleString()}</span><button onClick={() => deleteItem('fixed_incomes', item.id)} className="text-slate-600"><Icon name="x" size={18}/></button></div></div>
                                    ))}</div>
                                </div>
                            </section>
                        )}
                    </main>

                    <nav className="fixed bottom-6 left-6 right-6 bank-card p-2 flex justify-around rounded-[2rem] z-40 border border-white/10 shadow-2xl">
                        <button onClick={() => setView('dashboard')} className={`hover-press flex flex-col items-center px-10 py-3 rounded-2xl transition-all ${view === 'dashboard' ? 'bg-white/[0.04] text-bank-balance' : 'text-slate-500'}`}><Icon name="wallet" size={22} /><span className="text-[11px] font-black mt-1.5 uppercase tracking-wider">ראשי</span></button>
                        <button onClick={() => setView('settings')} className={`hover-press flex flex-col items-center px-10 py-3 rounded-2xl transition-all ${view === 'settings' ? 'bg-white/[0.04] text-white' : 'text-slate-500'}`}><Icon name="settings-2" size={22} /><span className="text-[11px] font-black mt-1.5 uppercase tracking-wider">ניהול</span></button>
                    </nav>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center">
                            <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={() => setIsModalOpen(false)}></div>
                            <div className={`relative w-full max-w-md bank-card rounded-b-none rounded-t-[3rem] p-10 animate-rise border-t-2 ${modalType === 'income' ? 'border-bank-income' : 'border-bank-expense'} shadow-[0_-20px_50px_rgba(0,0,0,0.5)]`}>
                                <div className="w-12 h-1.5 bg-white/10 rounded-full mx-auto mb-8"></div>
                                <h3 className="text-2xl font-black text-center mb-8 text-white tracking-tight">{modalType === 'income' ? 'הכנסה חדשה 💰' : 'הוצאה חדשה 💸'}</h3>
                                <form onSubmit={handleAddItem} className="space-y-8">
                                    <div className="relative">
                                        <span className={`absolute left-6 top-1/2 -translate-y-1/2 text-3xl font-black ${modalType === 'income' ? 'text-bank-income' : 'text-white'} opacity-50`}>₪</span>
                                        <input name="amount" type="number" required autoFocus className={`cyber-input text-6xl font-black text-center py-8 font-mono border-2 transition-all ${modalType === 'income' ? 'text-bank-income border-bank-income/20 focus:border-bank-income' : 'text-white border-white/10 focus:border-white'}`} placeholder="0" />
                                    </div>
                                    <input name="description" required className="cyber-input text-center text-xl" placeholder="עבור מה הפעולה?" />
                                    <button type="submit" className={`hover-press w-full p-6 rounded-2xl font-black text-xl text-dark-bg shadow-2xl ${modalType === 'income' ? 'bg-bank-income shadow-glow-income' : 'bg-white'}`}>אישור ועדכון יתרה</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
