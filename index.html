<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO Banking</title>

    <!-- Favicon: the logo as SVG data URI -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#06090F', card: '#0D1320', surface: '#131D2E' },
                        neon: {
                            cyan:  '#00E5FF',
                            green: '#00E676',
                            red:   '#FF1744',
                            gold:  '#FFD600',
                        }
                    },
                    fontFamily: {
                        display: ['"Syne"', 'sans-serif'],
                        mono:    ['"JetBrains Mono"', 'monospace'],
                    },
                    keyframes: {
                        shimmer: { '0%,100%': { opacity: '0.5' }, '50%': { opacity: '1' } },
                        floatUp: { from: { opacity: '0', transform: 'translateY(24px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
                        slideUp: { from: { transform: 'translateY(100%)' }, to: { transform: 'translateY(0)' } },
                        pulseGlow: {
                            '0%,100%': { boxShadow: '0 0 0 0 rgba(0,229,255,0)' },
                            '50%':     { boxShadow: '0 0 18px 4px rgba(0,229,255,0.25)' }
                        },
                        livePulse: {
                            '0%':   { boxShadow: '0 0 0 0 rgba(0,230,118,0.5)' },
                            '70%':  { boxShadow: '0 0 0 7px rgba(0,230,118,0)' },
                            '100%': { boxShadow: '0 0 0 0 rgba(0,230,118,0)' }
                        },
                        scanline: {
                            '0%':   { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(400%)' }
                        },
                        ticker: {
                            '0%':   { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        numberCount: {
                            from: { opacity: 0, transform: 'translateY(8px)' },
                            to:   { opacity: 1, transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        shimmer:     'shimmer 2.5s ease-in-out infinite',
                        floatUp:     'floatUp 0.55s cubic-bezier(0.16,1,0.3,1) forwards',
                        slideUp:     'slideUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards',
                        pulseGlow:   'pulseGlow 3s ease-in-out infinite',
                        livePulse:   'livePulse 2s ease-in-out infinite',
                        scanline:    'scanline 3s linear infinite',
                        ticker:      'ticker 22s linear infinite',
                        numberCount: 'numberCount 0.45s ease forwards',
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #06090F;
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Grid noise overlay ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(0,229,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── Glassmorphic card ── */
        .glass-card {
            background: linear-gradient(145deg, rgba(13,19,32,0.9) 0%, rgba(6,9,15,0.95) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1.5rem;
        }

        /* ── Hero balance card ── */
        .hero-card {
            background: linear-gradient(135deg, #0D1320 0%, #080C16 100%);
            border-radius: 1.75rem;
            border: 1px solid rgba(0,229,255,0.15);
            position: relative;
            overflow: hidden;
        }
        .hero-card::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 60% -20%, rgba(0,229,255,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── Scanline sweep ── */
        .scanline-sweep::before {
            content: '';
            position: absolute; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,229,255,0.35), transparent);
            animation: scanline 3s linear infinite;
            pointer-events: none; z-index: 1;
        }

        /* ── Logo frame ── */
        .logo-frame {
            background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.25rem;
            padding: 3px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .logo-frame img { border-radius: 1rem; display: block; }

        /* ── Input ── */
        .cyber-input {
            background: rgba(6,9,15,0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
            padding: 1.1rem 1.25rem;
            width: 100%;
            outline: none;
            color: #FFF;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            text-align: right;
        }
        .cyber-input:focus {
            border-color: #00E5FF;
            box-shadow: 0 0 0 3px rgba(0,229,255,0.1), 0 0 20px rgba(0,229,255,0.08);
            background: rgba(13,19,32,1);
        }
        .cyber-input::placeholder { color: rgba(255,255,255,0.25); }

        /* ── Press effect ── */
        .press:active { transform: scale(0.96); }

        /* ── Nav pill ── */
        .nav-pill {
            background: linear-gradient(180deg, rgba(13,19,32,0.97) 0%, rgba(6,9,15,0.99) 100%);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 1.5rem;
            backdrop-filter: blur(20px);
        }

        /* ── Live dot ── */
        .live-dot {
            width: 7px; height: 7px;
            background: #00E676;
            border-radius: 50%;
            animation: livePulse 2s ease-in-out infinite;
        }

        /* ── Ticker ── */
        .ticker-track {
            display: flex;
            width: max-content;
            animation: ticker 22s linear infinite;
        }

        /* ── Scrollbar hide ── */
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        /* ── Stagger helpers ── */
        .delay-1 { animation-delay: 0.08s; }
        .delay-2 { animation-delay: 0.16s; }
        .delay-3 { animation-delay: 0.24s; }
        .delay-4 { animation-delay: 0.32s; }

        /* ── Modal slide up ── */
        .modal-sheet { animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }

        /* ── Float up base ── */
        .rise { opacity: 0; animation: floatUp 0.55s cubic-bezier(0.16,1,0.3,1) forwards; }

        /* ── Balance digit animation ── */
        .balance-num { animation: numberCount 0.5s ease forwards; }

        /* ── Glow text ── */
        .glow-cyan { text-shadow: 0 0 20px rgba(0,229,255,0.5); }
        .glow-green { text-shadow: 0 0 16px rgba(0,230,118,0.4); }
        .glow-red   { text-shadow: 0 0 16px rgba(255,23,68,0.4); }

        /* ── Gradient border top ── */
        .border-glow-cyan  { border-top: 1px solid rgba(0,229,255,0.3); }
        .border-glow-green { border-top: 1px solid rgba(0,230,118,0.25); }
        .border-glow-red   { border-top: 1px solid rgba(255,23,68,0.25); }

        /* ── Transaction row hover ── */
        .tx-row { transition: background 0.18s; }
        .tx-row:hover { background: rgba(255,255,255,0.025); }

        /* ── CTA button ── */
        .btn-income  { background: linear-gradient(135deg, rgba(0,230,118,0.15), rgba(0,230,118,0.07)); border: 1px solid rgba(0,230,118,0.3); }
        .btn-expense { background: linear-gradient(135deg, rgba(255,23,68,0.15), rgba(255,23,68,0.07));  border: 1px solid rgba(255,23,68,0.3);  }

        /* ── Divider ── */
        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 0; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ── Firebase ── */
const firebaseConfig = {
    apiKey: "AIzaSyBqpLOIbztpurGuUqpfaWZT71JcofKG2rc",
    authDomain: "riki-aharele-budget.firebaseapp.com",
    projectId: "riki-aharele-budget",
    storageBucket: "riki-aharele-budget.firebasestorage.app",
    messagingSenderId: "53506652532",
    appId: "1:53506652532:web:28b3e3fc28114b1feb9421"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

/* ── Icon helper ── */
const Icon = ({ name, size = 22, className = '' }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (!ref.current || !window.lucide) return;
        ref.current.innerHTML = `<i data-lucide="${name}"></i>`;
        window.lucide.createIcons({ root: ref.current });
        const svg = ref.current.querySelector('svg');
        if (svg) { svg.style.width = size + 'px'; svg.style.height = size + 'px'; if (className) svg.className.baseVal = className; }
    }, [name, size, className]);
    return <span ref={ref} className="inline-flex items-center justify-center" />;
};

/* ── Error boundary ── */
class ErrorBoundary extends React.Component {
    state = { err: false };
    static getDerivedStateFromError() { return { err: true }; }
    render() {
        if (this.state.err) return (
            <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center">
                <p className="text-2xl font-bold mb-4">שגיאה במערכת</p>
                <button onClick={() => window.location.reload()} className="bg-neon-cyan text-dark-bg px-8 py-3 rounded-2xl font-bold">טען מחדש</button>
            </div>
        );
        return this.props.children;
    }
}

/* ════════════════════════════════════════
   LOGIN SCREEN
════════════════════════════════════════ */
const LoginScreen = () => {
    const [mode, setMode]       = useState('login'); // login | register | setname
    const [email, setEmail]     = useState('');
    const [pass,  setPass]      = useState('');
    const [name,  setName]      = useState('');
    const [error, setError]     = useState('');
    const [pending, setPending] = useState(false);

    const handleGoogle = async () => {
        setPending(true);
        try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        catch (e) { setError('שגיאה בכניסה עם גוגל'); setPending(false); }
    };

    const handleEmailAuth = async (e) => {
        e.preventDefault(); setError(''); setPending(true);
        try {
            if (mode === 'register') {
                const cred = await auth.createUserWithEmailAndPassword(email, pass);
                // After register → collect display name
                await auth.currentUser.updateProfile({ displayName: name || '' });
                // also save to firestore
                if (name) await db.collection('users').doc(cred.user.uid).set({ displayName: name }, { merge: true });
            } else {
                const cred = await auth.signInWithEmailAndPassword(email, pass);
                // If user has no display name, go to setname step
                if (!cred.user.displayName) {
                    const doc = await db.collection('users').doc(cred.user.uid).get();
                    if (!doc.exists || !doc.data()?.displayName) { setMode('setname'); setPending(false); return; }
                }
            }
        } catch (e) {
            setError(mode === 'register' ? 'לא ניתן ליצור חשבון. בדוק את הפרטים.' : 'אימייל או סיסמה שגויים.');
            setPending(false);
        }
    };

    const handleSetName = async (e) => {
        e.preventDefault(); setError(''); setPending(true);
        try {
            await auth.currentUser.updateProfile({ displayName: name });
            await db.collection('users').doc(auth.currentUser.uid).set({ displayName: name }, { merge: true });
            // force re-auth state
            window.location.reload();
        } catch { setError('שגיאה בשמירת השם.'); setPending(false); }
    };

    if (mode === 'setname') return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-dark-bg">
            <div className="w-full max-w-sm rise">
                <div className="flex flex-col items-center mb-8">
                    <div className="logo-frame w-20 h-20 mb-5"><img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full" /></div>
                    <h1 className="text-2xl font-bold">ברוך הבא!</h1>
                    <p className="text-slate-400 text-sm mt-1">איך לקרוא לך?</p>
                </div>
                <div className="glass-card p-7">
                    <form onSubmit={handleSetName} className="space-y-4">
                        <input className="cyber-input" placeholder="השם המלא שלך" value={name} onChange={e => setName(e.target.value)} required />
                        {error && <p className="text-neon-red text-xs font-bold text-center">{error}</p>}
                        <button type="submit" disabled={pending} className="press w-full bg-neon-cyan text-dark-bg p-4 rounded-2xl font-bold text-base transition-opacity disabled:opacity-50">
                            {pending ? 'שומר...' : 'כניסה לחשבון'}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    );

    return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-dark-bg">
            <div className="w-full max-w-sm">
                {/* Header */}
                <div className="flex flex-col items-center mb-8 rise">
                    <div className="logo-frame w-24 h-24 mb-5 animation-pulseGlow"><img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full" /></div>
                    <h1 className="text-3xl font-extrabold tracking-tight">AO Banking</h1>
                    <p className="text-slate-400 text-sm mt-1 font-medium">ניהול תקציב חכם ופשוט</p>
                </div>

                <div className="glass-card p-7 rise delay-1">
                    {/* Google */}
                    <button onClick={handleGoogle} disabled={pending} className="press w-full bg-white text-dark-bg p-4 rounded-2xl font-bold flex items-center justify-center gap-3 mb-6 transition-all shadow-lg shadow-black/30 disabled:opacity-50">
                        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                        כניסה עם גוגל
                    </button>

                    <div className="flex items-center gap-3 text-slate-600 mb-5">
                        <div className="h-px bg-white/5 flex-1"></div>
                        <span className="text-[11px] font-bold tracking-widest uppercase text-slate-500">או עם אימייל</span>
                        <div className="h-px bg-white/5 flex-1"></div>
                    </div>

                    <form onSubmit={handleEmailAuth} className="space-y-3">
                        {mode === 'register' && (
                            <input className="cyber-input" placeholder="השם המלא שלך" value={name} onChange={e => setName(e.target.value)} required />
                        )}
                        <input type="email" className="cyber-input" placeholder="כתובת אימייל" value={email} onChange={e => setEmail(e.target.value)} required />
                        <input type="password" className="cyber-input" placeholder="סיסמה" value={pass} onChange={e => setPass(e.target.value)} required />
                        {error && <p className="text-neon-red text-xs font-bold text-center pt-1">{error}</p>}
                        <button type="submit" disabled={pending} className="press w-full bg-neon-cyan text-dark-bg p-4 rounded-2xl font-bold text-base mt-1 transition-all shadow-[0_0_20px_rgba(0,229,255,0.25)] disabled:opacity-50">
                            {pending ? '...' : (mode === 'register' ? 'יצירת חשבון' : 'כניסה לחשבון')}
                        </button>
                    </form>

                    <button onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); setError(''); }}
                        className="w-full text-slate-400 text-sm font-semibold mt-5 hover:text-white transition-colors text-center">
                        {mode === 'login' ? 'עוד אין חשבון? הירשם עכשיו →' : '← חזרה לכניסה'}
                    </button>
                </div>
            </div>
        </div>
    );
};

/* ════════════════════════════════════════
   MAIN APP
════════════════════════════════════════ */
const App = () => {
    const [user,    setUser]    = useState(null);
    const [loading, setLoading] = useState(true);
    const [resetDay, setResetDay] = useState(1);

    const [incomes,       setIncomes]       = useState([]);
    const [expenses,      setExpenses]      = useState([]);
    const [fixedExpenses, setFixedExpenses] = useState([]);
    const [fixedIncomes,  setFixedIncomes]  = useState([]);
    const [displayName,   setDisplayName]   = useState('');

    const [view,        setView]        = useState('dashboard');
    const [isModalOpen, setIsModalOpen] = useState(false);
    const [modalType,   setModalType]   = useState('income');

    /* ── Auth ── */
    useEffect(() => auth.onAuthStateChanged(u => { setUser(u); setLoading(false); }), []);

    /* ── Firestore listeners ── */
    useEffect(() => {
        if (!user) return;
        const uRef = db.collection('users').doc(user.uid);
        const s0 = uRef.onSnapshot(d => {
            if (d.exists) {
                if (d.data().resetDay) setResetDay(d.data().resetDay);
                if (d.data().displayName) setDisplayName(d.data().displayName);
            }
        });
        const s1 = uRef.collection('incomes').onSnapshot(s => setIncomes(s.docs.map(d => ({id:d.id,...d.data()}))));
        const s2 = uRef.collection('expenses').onSnapshot(s => setExpenses(s.docs.map(d => ({id:d.id,...d.data()}))));
        const s3 = uRef.collection('fixed_settings').onSnapshot(s => setFixedExpenses(s.docs.map(d => ({id:d.id,...d.data()}))));
        const s4 = uRef.collection('fixed_incomes').onSnapshot(s => setFixedIncomes(s.docs.map(d => ({id:d.id,...d.data()}))));
        return () => { s0(); s1(); s2(); s3(); s4(); };
    }, [user]);

    /* ── Cycle calculations ── */
    const cycleData = useMemo(() => {
        try {
            const now  = new Date();
            let start  = new Date(now.getFullYear(), now.getMonth(), resetDay || 1);
            if (now.getDate() < (resetDay || 1)) start.setMonth(start.getMonth() - 1);

            const fInc = incomes.filter(i  => new Date(i.date)  >= start);
            const fExp = expenses.filter(e => new Date(e.date)  >= start);
            const tInc = fInc.reduce((s,i) => s + Number(i.amount||0), 0)
                       + fixedIncomes.reduce((s,i) => s + Number(i.amount||0), 0);
            const tFix = fixedExpenses.reduce((s,i) => s + Number(i.amount||0), 0);
            const tVar = fExp.reduce((s,i) => s + Number(i.amount||0), 0);
            return { totalIncome: tInc, totalFixedExp: tFix, totalVarExp: tVar,
                     balance: tInc - tFix - tVar, filteredIncomes: fInc, filteredExpenses: fExp };
        } catch { return { totalIncome:0, totalFixedExp:0, totalVarExp:0, balance:0, filteredIncomes:[], filteredExpenses:[] }; }
    }, [incomes, expenses, fixedExpenses, fixedIncomes, resetDay]);

    /* ── Add variable item ── */
    const handleAddItem = async (e) => {
        e.preventDefault();
        const fd  = new FormData(e.target);
        const col = modalType === 'income' ? 'incomes' : 'expenses';
        await db.collection('users').doc(user.uid).collection(col).add({
            amount: Number(fd.get('amount')),
            description: fd.get('description'),
            date: new Date().toISOString()
        });
        setIsModalOpen(false);
    };

    /* ── Add fixed item ── */
    const handleAddFixed = async (e, type) => {
        e.preventDefault();
        const fd  = new FormData(e.target);
        const col = type === 'income' ? 'fixed_incomes' : 'fixed_settings';
        await db.collection('users').doc(user.uid).collection(col).add({
            name: fd.get('name'), amount: Number(fd.get('amount'))
        });
        e.target.reset();
    };

    /* ── Delete ── */
    const deleteItem = async (col, id) =>
        db.collection('users').doc(user.uid).collection(col).doc(id).delete();

    /* ── Save display name from settings ── */
    const saveDisplayName = async (newName) => {
        try {
            await auth.currentUser.updateProfile({ displayName: newName });
            await db.collection('users').doc(user.uid).set({ displayName: newName }, { merge: true });
            setDisplayName(newName);
        } catch (e) { console.error(e); }
    };

    /* ── Loading ── */
    if (loading) return (
        <div className="min-h-screen flex flex-col items-center justify-center bg-dark-bg">
            <div className="logo-frame w-16 h-16 mb-5 animate-pulseGlow">
                <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full" />
            </div>
            <p className="text-slate-500 text-sm font-semibold animate-shimmer">מתחבר לחשבון...</p>
        </div>
    );

    if (!user) return <LoginScreen />;

    const firstName = displayName || user.displayName || (user.email ? user.email.split('@')[0] : 'משתמש');
    const combined  = [...cycleData.filteredIncomes.map(i => ({...i,_type:'income'})),
                       ...cycleData.filteredExpenses.map(i => ({...i,_type:'expense'}))]
                      .sort((a,b) => new Date(b.date) - new Date(a.date));

    return (
        <div className="min-h-screen pb-36 bg-dark-bg relative">

            {/* ── Ticker strip ── */}
            <div className="overflow-hidden bg-dark-card border-b border-white/5 py-2" style={{height:'28px'}}>
                <div className="ticker-track text-[11px] font-mono text-slate-500 gap-12" style={{whiteSpace:'nowrap'}}>
                    {[...Array(2)].map((_,k) => (
                        <span key={k} style={{display:'inline-flex',gap:'3rem',paddingLeft:'3rem'}}>
                            <span>AO Banking v2.0</span>
                            <span className="text-neon-cyan">●</span>
                            <span>יתרה: ₪{cycleData.balance.toLocaleString()}</span>
                            <span className="text-neon-cyan">●</span>
                            <span>הכנסות: ₪{cycleData.totalIncome.toLocaleString()}</span>
                            <span className="text-neon-cyan">●</span>
                            <span>הוצאות קבועות: ₪{cycleData.totalFixedExp.toLocaleString()}</span>
                            <span className="text-neon-cyan">●</span>
                            <span>הוצאות משתנות: ₪{cycleData.totalVarExp.toLocaleString()}</span>
                            <span className="text-neon-cyan">●</span>
                        </span>
                    ))}
                </div>
            </div>

            {/* ════ HEADER ════ */}
            <header className="px-5 pt-7 pb-1">

                {/* Top bar */}
                <div className="flex justify-between items-center mb-6 rise">
                    <div className="flex items-center gap-3">
                        <div className="logo-frame w-11 h-11">
                            <img src="https://i.ibb.co/pB3Yp5jN/IMG-20260419-WA0041.jpg" className="w-full h-full" />
                        </div>
                        <div>
                            <p className="font-bold text-[17px] leading-none">שלום, {firstName.split(' ')[0]}</p>
                            <div className="flex items-center gap-1.5 mt-1">
                                <div className="live-dot"></div>
                                <p className="text-[11px] text-slate-500 font-medium">חשבון פעיל</p>
                            </div>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => window.location.reload()} className="press glass-card p-2.5 text-slate-400 hover:text-white transition-colors">
                            <Icon name="refresh-cw" size={17}/>
                        </button>
                        <button onClick={() => auth.signOut()} className="press glass-card p-2.5 text-slate-400 hover:text-white transition-colors">
                            <Icon name="log-out" size={17}/>
                        </button>
                    </div>
                </div>

                {/* Hero balance card */}
                <div className="hero-card scanline-sweep p-8 text-center rise delay-1">
                    <p className="text-slate-400 text-xs font-semibold uppercase tracking-widest mb-3">יתרה פנויה</p>
                    <p key={cycleData.balance} className={`text-[3.2rem] font-extrabold tracking-tight leading-none balance-num ${cycleData.balance >= 0 ? 'text-neon-cyan glow-cyan' : 'text-neon-red glow-red'}`} dir="ltr">
                        ₪{cycleData.balance.toLocaleString()}
                    </p>
                    <div className="mt-4 h-px w-24 mx-auto bg-gradient-to-r from-transparent via-neon-cyan to-transparent opacity-40"></div>
                </div>

                {/* 3-stat row */}
                <div className="grid grid-cols-3 gap-2.5 mt-3 rise delay-2">
                    <div className="glass-card border-glow-green p-3.5 text-center">
                        <p className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mb-1">הכנסות</p>
                        <p className="text-neon-green font-bold text-base glow-green">₪{cycleData.totalIncome.toLocaleString()}</p>
                    </div>
                    <div className="glass-card border-glow-red p-3.5 text-center">
                        <p className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mb-1">קבועות</p>
                        <p className="text-neon-red font-bold text-base">₪{cycleData.totalFixedExp.toLocaleString()}</p>
                    </div>
                    <div className="glass-card border-glow-red p-3.5 text-center">
                        <p className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mb-1">משתנות</p>
                        <p className="text-neon-red font-bold text-base">₪{cycleData.totalVarExp.toLocaleString()}</p>
                    </div>
                </div>
            </header>

            {/* ════ MAIN ════ */}
            <main className="px-5 mt-5 space-y-6">

                {/* ── DASHBOARD ── */}
                {view === 'dashboard' && (
                    <div className="rise delay-3">
                        {/* Action buttons */}
                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <button onClick={() => { setModalType('income'); setIsModalOpen(true); }}
                                className="press btn-income glass-card p-5 flex flex-col items-center gap-2.5 rounded-2xl">
                                <div className="w-10 h-10 rounded-xl bg-neon-green/10 border border-neon-green/20 flex items-center justify-center">
                                    <Icon name="plus" size={20} className="text-neon-green" />
                                </div>
                                <span className="text-sm font-bold text-neon-green">הפקדה</span>
                            </button>
                            <button onClick={() => { setModalType('expense'); setIsModalOpen(true); }}
                                className="press btn-expense glass-card p-5 flex flex-col items-center gap-2.5 rounded-2xl">
                                <div className="w-10 h-10 rounded-xl bg-neon-red/10 border border-neon-red/20 flex items-center justify-center">
                                    <Icon name="minus" size={20} className="text-neon-red" />
                                </div>
                                <span className="text-sm font-bold text-neon-red">חיוב</span>
                            </button>
                        </div>

                        {/* Transactions */}
                        <div>
                            <div className="flex justify-between items-center mb-3 px-0.5">
                                <h3 className="font-bold text-base">תנועות אחרונות</h3>
                                <span className="text-[11px] text-slate-500 font-medium">המחזור הנוכחי</span>
                            </div>

                            <div className="glass-card overflow-hidden">
                                {combined.length === 0
                                    ? <div className="p-8 text-center text-slate-500 text-sm font-medium">
                                        <Icon name="inbox" size={28} className="text-slate-700 mb-3" />
                                        <p>אין תנועות במחזור הנוכחי</p>
                                      </div>
                                    : combined.map((item, idx) => {
                                        const isInc = item._type === 'income';
                                        return (
                                            <div key={item.id}
                                                className={`tx-row px-4 py-3.5 flex justify-between items-center ${idx < combined.length-1 ? 'border-b border-white/[0.04]' : ''}`}>
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0
                                                        ${isInc ? 'bg-neon-green/10 border border-neon-green/20' : 'bg-white/5 border border-white/10'}`}>
                                                        <Icon name={isInc ? 'arrow-up-right' : 'arrow-down-left'} size={15}
                                                            className={isInc ? 'text-neon-green' : 'text-slate-400'} />
                                                    </div>
                                                    <div>
                                                        <p className="font-semibold text-[13px] leading-tight">{item.description}</p>
                                                        <p className="text-[10px] text-slate-600 mt-0.5 font-mono">
                                                            {new Date(item.date).toLocaleDateString('he-IL')}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className={`font-mono font-bold text-sm ${isInc ? 'text-neon-green' : 'text-white'}`} dir="ltr">
                                                        {isInc ? '+' : '−'}₪{Number(item.amount).toLocaleString()}
                                                    </span>
                                                    <button onClick={() => deleteItem(isInc ? 'incomes' : 'expenses', item.id)}
                                                        className="text-slate-700 hover:text-neon-red transition-colors press">
                                                        <Icon name="x" size={15}/>
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })
                                }
                            </div>
                        </div>
                    </div>
                )}

                {/* ── SETTINGS ── */}
                {view === 'settings' && (
                    <div className="space-y-5 rise">

                        {/* Change name */}
                        <SettingsSection title="שינוי שם" icon="user" accentColor="neon-cyan">
                            <NameChangeForm current={displayName || user.displayName || ''} onSave={saveDisplayName} />
                        </SettingsSection>

                        {/* Reset day */}
                        <SettingsSection title="יום איפוס תקציב" icon="calendar" accentColor="neon-cyan">
                            <p className="text-slate-400 text-sm mb-4">באיזה יום מתאפס המחזור החודשי?</p>
                            <div className="flex items-center gap-3">
                                <input type="number" min="1" max="31" value={resetDay}
                                    onChange={e => {
                                        const v = Number(e.target.value);
                                        setResetDay(v);
                                        if (v >= 1 && v <= 31) db.collection('users').doc(user.uid).set({ resetDay: v }, { merge: true });
                                    }}
                                    className="cyber-input text-center font-mono text-xl" style={{maxWidth:'100px'}} />
                                <span className="text-slate-400 font-semibold">לחודש</span>
                            </div>
                        </SettingsSection>

                        {/* Fixed expenses */}
                        <SettingsSection title="הוראות קבע – הוצאות" icon="credit-card" accentColor="neon-red">
                            <form onSubmit={e => handleAddFixed(e, 'expense')} className="space-y-3 mb-4">
                                <input name="name" required className="cyber-input" placeholder="שם החיוב (משכנתא, ביטוח...)" />
                                <input name="amount" type="number" required className="cyber-input" placeholder="סכום בשקלים" />
                                <button type="submit" className="press w-full border border-white/10 text-white p-3 rounded-xl font-bold text-sm hover:bg-white/5 transition-colors">
                                    + הוסף חיוב קבוע
                                </button>
                            </form>
                            <div className="space-y-2">
                                {fixedExpenses.map(item => (
                                    <FixedRow key={item.id} item={item} color="neon-red"
                                        onDelete={() => deleteItem('fixed_settings', item.id)} />
                                ))}
                            </div>
                        </SettingsSection>

                        {/* Fixed incomes */}
                        <SettingsSection title="הכנסות קבועות" icon="trending-up" accentColor="neon-green">
                            <form onSubmit={e => handleAddFixed(e, 'income')} className="space-y-3 mb-4">
                                <input name="name" required className="cyber-input" placeholder="מקור הכנסה (משכורת, שכירות...)" />
                                <input name="amount" type="number" required className="cyber-input" placeholder="סכום בשקלים" />
                                <button type="submit" className="press w-full border border-white/10 text-white p-3 rounded-xl font-bold text-sm hover:bg-white/5 transition-colors">
                                    + הוסף הכנסה קבועה
                                </button>
                            </form>
                            <div className="space-y-2">
                                {fixedIncomes.map(item => (
                                    <FixedRow key={item.id} item={item} color="neon-green"
                                        onDelete={() => deleteItem('fixed_incomes', item.id)} />
                                ))}
                            </div>
                        </SettingsSection>

                    </div>
                )}
            </main>

            {/* ════ BOTTOM NAV ════ */}
            <nav className="fixed bottom-4 left-4 right-4 nav-pill flex z-40">
                <NavBtn active={view==='dashboard'} onClick={() => setView('dashboard')}
                    icon="wallet" label="החשבון שלי" />
                <NavBtn active={view==='settings'}  onClick={() => setView('settings')}
                    icon="sliders-horizontal" label="הגדרות" />
            </nav>

            {/* ════ MODAL ════ */}
            {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-end justify-center">
                    <div className="absolute inset-0 bg-black/70 backdrop-blur-sm"
                        onClick={() => setIsModalOpen(false)} />
                    <div className={`modal-sheet relative w-full max-w-md glass-card rounded-b-none rounded-t-[2rem] p-7
                        ${modalType === 'income'
                            ? 'border-t-2 border-t-neon-green'
                            : 'border-t-2 border-t-neon-red'}`}>

                        {/* drag handle */}
                        <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto mb-5"></div>

                        <h3 className="text-center font-bold text-lg mb-6">
                            {modalType === 'income' ? 'הוספת הפקדה' : 'הוספת הוצאה'}
                        </h3>

                        <form onSubmit={handleAddItem} className="space-y-4">
                            <input name="amount" type="number" required autoFocus
                                className={`cyber-input text-5xl font-mono font-black text-center py-6
                                    ${modalType === 'income'
                                        ? 'text-neon-green border-neon-green/30 focus:border-neon-green'
                                        : 'text-white border-neon-red/30 focus:border-neon-red'}`}
                                style={{border:'1px solid'}}
                                placeholder="0" />
                            <input name="description" required className="cyber-input text-center" placeholder="תיאור הפעולה" />
                            <button type="submit"
                                className={`press w-full p-4 rounded-2xl font-bold text-base text-dark-bg
                                    ${modalType === 'income'
                                        ? 'bg-neon-green shadow-[0_0_24px_rgba(0,230,118,0.3)]'
                                        : 'bg-neon-red shadow-[0_0_24px_rgba(255,23,68,0.3)]'}`}>
                                אישור ועדכון יתרה
                            </button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

/* ── Sub-components ── */

const SettingsSection = ({ title, icon, accentColor, children }) => (
    <div className="glass-card overflow-hidden">
        <div className={`px-5 py-4 border-b border-white/5 flex items-center gap-2.5`}>
            <Icon name={icon} size={17} className={`text-${accentColor}`} />
            <h3 className="font-bold text-[15px]">{title}</h3>
        </div>
        <div className="p-5">{children}</div>
    </div>
);

const FixedRow = ({ item, color, onDelete }) => (
    <div className="flex justify-between items-center bg-white/[0.03] border border-white/5 rounded-xl px-4 py-3">
        <span className="text-sm font-semibold">{item.name}</span>
        <div className="flex items-center gap-3">
            <span className={`font-mono font-bold text-sm text-${color}`}>₪{Number(item.amount).toLocaleString()}</span>
            <button onClick={onDelete} className="text-slate-600 hover:text-neon-red transition-colors press">
                <Icon name="trash-2" size={14}/>
            </button>
        </div>
    </div>
);

const NavBtn = ({ active, onClick, icon, label }) => (
    <button onClick={onClick}
        className={`press flex-1 flex flex-col items-center py-3.5 gap-1.5 rounded-2xl transition-all
            ${active ? 'bg-white/[0.07] text-neon-cyan' : 'text-slate-500'}`}>
        <Icon name={icon} size={20} />
        <span className="text-[11px] font-bold tracking-wide">{label}</span>
    </button>
);

const NameChangeForm = ({ current, onSave }) => {
    const [val, setVal]       = useState(current);
    const [saved, setSaved]   = useState(false);
    const [busy, setBusy]     = useState(false);

    const handle = async (e) => {
        e.preventDefault();
        if (!val.trim()) return;
        setBusy(true);
        await onSave(val.trim());
        setBusy(false);
        setSaved(true);
        setTimeout(() => setSaved(false), 2500);
    };

    return (
        <form onSubmit={handle} className="space-y-3">
            <input className="cyber-input" placeholder="השם שלך" value={val} onChange={e => { setVal(e.target.value); setSaved(false); }} required />
            <button type="submit" disabled={busy || !val.trim()}
                className="press w-full border border-white/10 text-white p-3 rounded-xl font-bold text-sm hover:bg-white/5 transition-all disabled:opacity-40">
                {saved ? '✓ נשמר בהצלחה!' : (busy ? 'שומר...' : 'שמור שם')}
            </button>
        </form>
    );
};

/* ── Mount ── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
